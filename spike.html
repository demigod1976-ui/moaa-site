<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>모아 시험</title>
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --ink: #20352a; --sub: #7c8781; --primary: #3d6a4f; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 15px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .box { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .mono { font: 12px/1.4 monospace; white-space: pre-wrap; word-break: break-all; color: var(--sub); }
  a.b { display: block; background: var(--primary); color: #fff; text-decoration: none; border-radius: 12px; padding: 12px 14px; margin: 8px 0; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid var(--sub); }
</style>
</head>
<body>
<h1>모아 게이트 시험 (G1, 임시)</h1>
<div class="box"><div class="mono" id="env"></div></div>
<div class="box">
  <div>열 계정 이메일</div>
  <input id="em" type="email" autocomplete="off" placeholder="name@gmail.com">
</div>
<div class="box" id="links"></div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbwh8lzbmcLErjvd1Fttk1cpmzqKNgAWvR8U4FV7yGdxG5XDQ-C0FK5BjX8IGk9WRGor/exec';
  var LAUNCHER = 'https://script.google.com/macros/s/AKfycbzwKIlX-PpHv2IoMDwmwlfEerDuOkIDd10j4cUlc4zT--EmEC5jYzf9TYlU762btvv3BA/exec';
  var em = document.getElementById('em');
  var h = new URLSearchParams(location.hash.slice(1));
  em.value = h.get('e') || '';
  function enc(s) { return encodeURIComponent(s); }
  function render() {
    var e = em.value.trim();
    var target = APP + '?diag=1';
    var L = [
      ['1. 앱 바로 열기', target],
      ['2. 계정 선택(AccountChooser)', 'https://accounts.google.com/AccountChooser?Email=' + enc(e) + '&continue=' + enc(target)],
      ['3. 로그인 화면(ServiceLogin)', 'https://accounts.google.com/ServiceLogin?Email=' + enc(e) + '&continue=' + enc(target)],
      ['4. authuser=이메일', target + '&authuser=' + enc(e)],
      ['5. 카톡 → 바깥 브라우저', 'kakaotalk://web/openExternal?url=' + enc(location.href)],
      ['6. 문지기 페이지 열기', LAUNCHER + '?e=' + enc(e)],
      ['7. 문지기 /u/0/', LAUNCHER.replace('/macros/s/', '/macros/u/0/s/') + '?e=' + enc(e)],
      ['8. 문지기 /u/1/', LAUNCHER.replace('/macros/s/', '/macros/u/1/s/') + '?e=' + enc(e)],
      ['9. 앱 /u/0/', APP.replace('/macros/s/', '/macros/u/0/s/') + '?diag=1'],
      ['10. 앱 /u/1/', APP.replace('/macros/s/', '/macros/u/1/s/') + '?diag=1']
    ];
    document.getElementById('links').innerHTML = L.map(function (x) {
      return '<a class="b" href="' + x[1].replace(/"/g, '&quot;') + '">' + x[0] + '</a>';
    }).join('');
  }
  em.addEventListener('input', render);
  render();
  var dm = 'n/a';
  try { dm = String(matchMedia('(display-mode: standalone)').matches); } catch (e) {}
  document.getElementById('env').textContent = 'UA ' + navigator.userAgent + '\nstandalone ' + String(navigator.standalone) + ' dm ' + dm;
</script>
</body>
</html>
