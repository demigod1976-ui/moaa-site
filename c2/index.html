    // 세로 세 칸 (피드백 #56): 위(머리·세그먼트·금액) 고정 · 가운데(칩·4줄)만 스크롤 · 아래(버튼) 고정
    var h = '<div class="rec-top">' + App.subhead(title);
    h += '<div class="seg">' + ['지출', '수입'].map(function (t) {
      return '<button class="' + (f.type === t ? 'on' : '') + '"' + (f.type === t ? ' aria-pressed="true"' : '') + App.data({ act: 'recType', type: t }) +
        (edit && f.type !== t ? ' disabled' : '') + '>' + t + '</button>'; // 수정에서는 유형을 바꿀 수 없다
    }).join('') + '</div>';

    // 질문 줄은 큰 화면(보이는 높이 720px 이상)에서만 보인다 (#60, Styles 의 화면 크기 구간)
    var inst = this.instMonths(p);
    h += '<div class="ask rec-ask">' + (edit ? '기존 금액 ' + App.won(p.orig.amount) : f.type === '수입' ? '얼마를 받으셨나요?' :
      inst ? '총 얼마를 결제하셨나요? (할부 총액)' : '얼마를 쓰셨나요?') + '</div>';
    h += App.amountField(f.amount, f.type === '수입' ? '받은 금액' : '쓴 금액') + '</div><div class="rec-mid">';

    p.chips = edit || inst ? [] : recentChips(book.txns, f.type, 6);
    // 할부: 칩 줄 자리에 나눠 기록할 금액 (칩 줄과 같은 높이)
    if (inst) h += '<div class="inst-hint"><span>' + App.esc(this.instHint(Number(f.amount || 0), inst)) + '</span></div>';
    else h += p.chips.length ? '<div class="recent">' + p.chips.map(function (c, i) {
      return '<button class="rchip"' + App.data({ act: 'recChip', i: i }) + '><b>' + App.esc(c.memo || c.category) + '</b>' +
        '<span class="num">' + App.won(c.amount).replace(/원$/, '') + '</span></button>';
    }).join('') + '</div>' : '<div class="divider"></div>';

    var rows = [
      ['카테고리', f.category || '골라 주세요', 'recCatSheet', !f.category],
      ['날짜', this.dateText(f.date), 'recDaySheet', false],
      [f.type === '수입' ? '받은 수단' : '결제 수단', f.payMethod ? f.payMethod + this.instLabel(p) : '추가하기', 'recPaySheet', !f.payMethod],
      ['메모', f.memo || '입력하기', 'recMemoSheet', !f.memo],
    ];
    h += '<div class="rows">' + rows.map(function (r) {
      return '<button class="r"' + App.data({ act: r[2] }) + '><span class="k">' + r[0] + '</span>' +
        '<span class="v' + (r[3] ? ' empty' : '') + '"><span class="vt">' + App.esc(r[1]) + '</span>' + App.icon('right') + '</span></button>';
    }).join('') + '</div>' + (edit ? '<div class="hint rec-hint">' + this.editHint(p) + '</div>' : '') + '</div>';

    // 버튼 (#59): 어느 화면 크기든 아래 한 줄 [추가 기록 · 기록 완료(넓게, 주요 색)]. 내역 수정은 "변경사항 저장" 하나(한 줄 전체).
    // 알림은 버튼 줄 위(data-toast-anchor)
    var n = Number(f.amount || 0);
    var off = !n || p.saving ? ' disabled' : '';
    h += '<div class="rec-bottom"><div class="rec-pad">' + (edit
      ? '<div class="rec-btns single" data-toast-anchor>' +
        '<button class="rb-done" data-act="recDone"' + off + '>' + (p.saving ? '저장 중…' : '변경사항 저장') + '</button></div>'
      : '<div class="rec-btns" data-toast-anchor>' +
        '<button class="rb-more" data-act="recMore"' + off + '>' + (p.saving === 'more' ? '저장 중…' : '추가 기록') + '</button>' +
        '<button class="rb-done" data-act="recDone"' + off + '>' + (p.saving === 'done' ? '저장 중…' : '기록 완료') + '</button></div>') +
      '</div></div>';
    return h;
  },

  /** 화면 전체를 세로 칸으로 · 금액 칸 동작(App.amountMount). 다시 그려도(저장 응답·시트에서 고른 뒤) 가운데 스크롤 위치를 지킨다 */
  mount: function (el) {
    var p = this.cur(), R = this;
    el.classList.add('rec-screen');
    if (!p) return;
    App.amountMount(el, {
      get: function () { return p.f.amount; },
      set: function (d) { p.f.amount = d; },
      live: function () { R.live(el, p); },
    });
    var mid = el.querySelector('.rec-mid');
    if (!mid) return;
    mid.scrollTop = p.midTop || 0;
    mid.addEventListener('scroll', function () { p.midTop = mid.scrollTop; });
  },
  /** 금액을 칠 때마다 (화면 전체를 다시 그리지 않는다 — 금액 칸 초점이 빠진다): 버튼 누를 수 있음 · 할부 안내 · 내역 수정의 변경 안내 */
  live: function (el, p) {
    var n = Number(p.f.amount || 0);
    Array.prototype.forEach.call(el.querySelectorAll('[data-act=recMore], [data-act=recDone]'), function (b) { b.disabled = !n || !!p.saving; });
    var inst = this.instMonths(p), hint = el.querySelector('.inst-hint span');
    if (inst && hint) hint.textContent = this.instHint(n, inst);
    var edit = el.querySelector('.rec-hint');
    if (p.mode === 'edit' && edit) edit.textContent = this.editHint(p);
  },

  /** 처음 그릴 때 입력값을 정한다: 유형(params.type, 기본 지출) · 날짜 오늘 · 카테고리·결제 수단은 마지막에 쓴 값 */
  init: function (p) {
    if (p.f) return p.f;
    if (p.mode === 'edit') {
      var t = App.txnById(p.id);
      if (!t) return null;
      p.orig = { amount: t.amount, inst: t.inst, canceled: t.canceled, date: t.date };
      p.f = { type: t.type, amount: String(t.amount), category: t.category, date: t.date, payMethod: t.payMethod, memo: t.memo || '' };
      return p.f;
    }
    var type = p.type === '수입' ? '수입' : '지출';
    p.mode = p.mode || 'new';
    p.f = { type: type, amount: '', category: this.defaultCat(type), date: App.state.today, payMethod: this.defaultPay(type), memo: '', months: 1 };
    return p.f;
  },
  cats: function (type) {
    return (App.state.book.categories || []).filter(function (c) { return c.type === type; })
      .slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  },
  pays: function () { return App.pays(); },
  hasCat: function (type, name) { return this.cats(type).some(function (c) { return c.name === name; }); },
  hasPay: function (name) { return this.pays().some(function (x) { return x.name === name; }); },
  isCard: function (name) { return this.pays().some(function (x) { return x.name === name && x.kind === '카드'; }); },

  /* ---------- 할부 (작업 13) ---------- */

  /** 할부를 고를 수 있는 기록인가: 새 기록 · 지출 */
  canInst: function (p) { return p.mode !== 'edit' && p.f.type === '지출'; },
  /** 지금 고른 할부 개월 (2개월 이상일 때만, 아니면 0). 카드가 아니거나 수입이면 0 */
  instMonths: function (p) {
    var n = Number(p.f.months || 1);
    return n >= 2 && this.canInst(p) && this.isCard(p.f.payMethod) ? n : 0;
  },
  /** 결제 수단 줄 뒤에 붙는 말: " · 6개월 할부" / 카드 일시불 " · 일시불" / 그 밖 "" */
  instLabel: function (p) {
    if (!this.canInst(p) || !this.isCard(p.f.payMethod)) return '';
    var n = this.instMonths(p);
    return n ? ' · ' + n + '개월 할부' : ' · 일시불';
  },
  /** "이번 달 16,668원 + 다음 2개월 월 16,666원 미리 기록" (금액이 없으면 "3개월 할부 · 총액을 입력하세요") */
  instHint: function (total, months) {
    if (!total) return months + '개월 할부 · 총액을 입력하세요';
    if (total < months) return months + '개월 할부 · 총액은 ' + App.won(months) + ' 이상이어야 해요';
    var sp = installmentPreview(total, months);
    return '이번 달 ' + App.won(sp.first) + ' + 다음 ' + (months - 1) + '개월 월 ' + App.won(sp.rest) + ' 미리 기록';
  },
  /** 결제 수단 시트 아래 할부 개월 칩 (새 지출만). 카드가 아니면 누를 수 없다 */
  instChips: function (p) {
    if (!this.canInst(p)) return '';
    var card = this.isCard(p.f.payMethod), cur = this.instMonths(p) || 1;
    return '<div class="group-label">할부' + (card ? '' : ' · 카드를 고르면 할 수 있어요') + '</div><div class="inst-grid">' +
      [1].concat(INSTALL_MONTHS).map(function (n) {
        return '<button class="' + (cur === n ? 'on' : '') + '"' + (cur === n ? ' aria-pressed="true"' : '') + App.data({ act: 'recMonths', n: n }) +
          (card ? '' : ' disabled') + '>' + (n === 1 ? '일시불' : n + '개월') + '</button>';
      }).join('') + '</div>';
  },
  defaultCat: function (type) {
    var last = (App.state.lastPick || {})[type];
    if (last && this.hasCat(type, last.category)) return last.category;
    var list = this.cats(type);
    return list.length ? list[0].name : '';
  },
  defaultPay: function (type) {
    var last = (App.state.lastPick || {})[type];
    if (last && this.hasPay(last.payMethod)) return last.payMethod;
    var list = this.pays();
    return list.length ? list[0].name : '';
  },
  /** 내역 수정: 금액이 바뀌면 "2,500원 늘어나며 남은 예산에도 반영돼요" (design §5 금액 변경) */
  editHint: function (p) {
    var d = Number(p.f.amount || 0) - p.orig.amount;
    if (!Number(p.f.amount || 0) || !d) return '';
    if (p.orig.canceled) return App.won(d) + (d > 0 ? ' 늘어나요' : ' 줄어들어요') + ' · 취소한 내역이라 합계에는 들어가지 않아요';
    if (p.f.type === '수입') return App.won(d) + (d > 0 ? ' 늘어나요' : ' 줄어들어요');
    return App.won(d) + (d > 0 ? ' 늘어나며' : ' 줄어들며') + ' 남은 예산에도 반영돼요';
  },
  /** '2026-11-15' → '2026년 11월 15일' (design §5 입력 날짜) */
  dateText: function (ymd) {
    return Number(ymd.slice(0, 4)) + '년 ' + Number(ymd.slice(5, 7)) + '월 ' + Number(ymd.slice(8, 10)) + '일';
  },
  /** 지금 맨 위 화면이 기록 화면이면 그 params */
  cur: function () {
    var top = App.stack[App.stack.length - 1];
    return top && top.name === 'record' ? top.params : null;
  },

  /* ---------- 시트 ---------- */

  catSheet: function () {
    var p = this.cur(); if (!p) return;
    var f = p.f;
    App.sheet('카테고리', '<div class="rows">' + this.cats(f.type).map(function (c) {
      return '<button class="r"' + App.data({ act: 'recPickCat', name: c.name }) + '><span class="pick-l">' + App.catTile(c.name) + App.esc(c.name) + '</span>' +
        '<span class="v">' + (c.name === f.category ? App.icon('check') : '') + '</span></button>';
    }).join('') + '</div>');
  },
  /**
   * 날짜 창 (#87 · #91): 열면 바로 그 달 달력, 지금 날짜가 고른 날. ‹ › 로 달을 옮기고(서버 없이 다시 그림),
   * 날짜를 누르면 고른 날 표시만 옮기고(recPickDay — 예산 없는 미래 달은 알리고 고르지 않는다, #70), 아래 확인을 누르면 반영하고 닫는다(recDayOk).
   * 달력은 언제나 6주 줄 — 다른 달의 날 칸·남는 주는 빈칸이라, 달을 옮겨도 창 높이·달 이동 줄·확인 버튼 자리가 그대로다.
   * 오늘은 테두리, 고른 날은 연녹색 바탕(--soft)에 굵은 녹색 숫자(리포트 달력과 같은 표시).
   * ym 이 없으면(창을 새로 열 때) 고른 날을 지금 날짜로 되돌리고 그 달. 칸은 Month.js calendarWeeks (일요일 시작)
   */
  daySheet: function (ym) {
    var p = this.cur(); if (!p) return;
    if (!ym || !p.dayPick) p.dayPick = p.f.date;
    var sel = p.dayPick, today = App.state.today;
    p.dayYm = ym || { year: Number(sel.slice(0, 4)), month: Number(sel.slice(5, 7)) };
    var y = p.dayYm.year, m = p.dayYm.month;
    var weeks = calendarWeeks(App.state.book, y, m);
    while (weeks.length < 6) weeks.push([null, null, null, null, null, null, null]); // 4·5주 달도 6주 높이
    var h = '<div class="day-cal-head"><div class="pill month-nav"><button' + App.data({ act: 'recDayMonth', d: -1 }) + ' aria-label="이전 달">' + App.icon('left') + '</button>' +
      '<span class="num">' + y + '년 ' + m + '월</span>' +
      '<button' + App.data({ act: 'recDayMonth', d: 1 }) + ' aria-label="다음 달">' + App.icon('right') + '</button></div></div>' +
      '<div class="card day-cal"><div class="cal-dow">' + '일월화수목금토'.split('').map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>';
    h += weeks.map(function (week) {
      return '<div class="cal-week">' + week.map(function (c) {
        if (!c) return '<span class="cal-day blank"></span>';
        var on = c.date === sel, now = c.date === today;
        return '<button class="cal-day' + (on ? ' on' : '') + (now ? ' today' : '') + '"' + App.data({ act: 'recPickDay', date: c.date }) +
          ' aria-label="' + m + '월 ' + c.day + '일 (' + weekdayKo(c.date) + ')' + (now ? ' 오늘' : '') + '"' + (on ? ' aria-pressed="true"' : '') + '>' +
          '<b class="num">' + c.day + '</b></button>';
      }).join('') + '</div>';
    }).join('');
    App.sheet('날짜', h + '</div><div class="day-cal-go"><button class="btn" data-act="recDayOk">확인</button></div>');
    document.getElementById('sheet').classList.add('day-sheet'); // 닫으면 closeSheet 가 지운다
  },
  /**
   * 고른 날짜가 예산 없는 미래 달이면 알리고 true (#70, 서버 api_saveTxn 이 진짜로 막는다).
   * 수정은 날짜의 달을 바꿀 때만 본다 (이미 그 달에 있는 할부 회차는 고칠 수 있다)
   */
  blockedDate: function (date) {
    var p = this.cur();
    if (p && p.mode === 'edit' && p.orig && String(p.orig.date).slice(0, 7) === String(date).slice(0, 7)) return false;
    if (!futureMonthWithoutBudget(App.state.book, date, App.state.today)) return false;
    App.toast(NO_BUDGET_MONTH_TEXT);
    return true;
  },
  memoSheet: function () {
    var p = this.cur(); if (!p) return;
    App.sheet('메모', '<input class="text" id="recMemo" maxlength="60" placeholder="예: 점심 식사" enterkeyhint="done" value="' + App.esc(p.f.memo) + '"' +
      ' onkeydown="if (event.key === \'Enter\') { event.preventDefault(); this.blur(); }">' +
      '<button class="btn" onclick="App.screens.record.pickMemo()">확인</button>', 'recMemo');
  },
  pickMemo: function () {
    var el = document.getElementById('recMemo');
    this.set({ memo: el ? el.value.trim() : '' });
  },
  paySheet: function () {
    var p = this.cur(); if (!p) return;
    var R = this;
    App.pickPay(function (name) {
      p.payTouched = true;
      R.set({ payMethod: name });
      if (!R.isCard(name)) p.f.months = 1; // 카드가 아니면 일시불로
      else if (R.canInst(p) && R.cur() === p) R.paySheet(); // 카드를 고르면 시트에 남아 개월을 고른다 (시안 paySheet)
    }, { selected: p.f.payMethod, title: p.f.type === '수입' ? '받은 수단' : '결제 수단', extra: this.instChips(p) });
  },
  /** 입력값을 바꾸고 시트를 닫고 다시 그린다 */
  set: function (patch) {
    var p = this.cur();
    App.closeSheet();
    if (!p) return;
    Object.keys(patch).forEach(function (k) { p.f[k] = patch[k]; });
    App.render();
  },

  /* ---------- 저장 · 되돌리기 ---------- */

  /** close: true = 기록 완료(저장하고 들어온 탭으로), false = 추가 기록(화면에 남는다) */
  save: function (close) {
    var p = this.cur(); if (!p || p.saving) return;
    if (App.syncToday()) return; // 화면을 연 채 달이 바뀌었고 새 달 예산이 없다 → 예산 수립 (#65, 쓰던 기록은 버린다)
    if (p.mode === 'edit') { this.saveEdit(); return; }
    if (this.blockedDate(p.f.date)) return; // 예산 없는 미래 달 (#70)
    var f = p.f, n = Number(f.amount || 0);
    if (!n) return;
    if (!f.category || !this.hasCat(f.type, f.category)) { this.catSheet(); return; }
    if (!f.payMethod || !this.hasPay(f.payMethod)) { this.paySheet(); return; }
    var months = this.instMonths(p);
    if (!p.pendingId) p.pendingId = newId(); // 다시 시도해도 같은 번호 → 서버에서 한 줄만
    var input = { id: p.pendingId, date: f.date, type: f.type, category: f.category, payMethod: f.payMethod, amount: n, memo: f.memo };
    if (months) input.months = months; // 할부: 서버가 회차마다 한 줄씩 넣고 할부 묶음을 만든다
    var self = this;
    p.saving = close ? 'done' : 'more';
    App.render();
    App.call('api_saveTxn', input).then(function (r) {
      p.saving = false;
      p.pendingId = null;
      App.invalidateLoads();
      var book = App.state.book;
      var ids = {};
      r.txns.forEach(function (t) { ids[t.id] = true; });
      // 시트처럼 맨 위가 최신: 할부의 앞날 회차가 더 위
      var fresh = r.txns.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      book.txns = fresh.concat(book.txns.filter(function (t) { return !ids[t.id]; }));
      if (r.install) book.installs = (book.installs || []).filter(function (x) { return x.id !== r.install.id; }).concat([r.install]);
      App.state.lastPick[input.type] = { category: input.category, payMethod: input.payMethod };
      // 알림은 서버가 돌려준 것으로 (다시 시도가 이미 들어간 일시불 줄을 돌려받았을 수 있다)
      var what = r.install ? r.install.months + '개월 할부' : App.won(r.txns[0].amount);
      if (close) {
        // 기록 완료: 들어온 탭으로 (그사이 사용자가 이미 닫았으면 화면은 그대로) + 이 기록만 되돌리는 알림
        if (self.cur() === p) App.close();
        else App.render();
        App.toast(what + ' 기록했어요', function () { self.undoSaved(r.txns); });
        return;
      }
      // 추가 기록: 금액·메모만 비운다 (저장하는 사이에 고친 값은 남긴다)
      if (f.amount === String(n)) f.amount = '';
      if (f.memo === input.memo) f.memo = '';
      if (months && Number(f.months) === months) f.months = 1; // 다음 기록은 일시불로
      if (self.cur() === p) App.render();
      App.toast(what + ' 추가 기록했어요', function () { self.undoSaved(r.txns); });
    }, function (e) {
      p.saving = false;
      if (self.cur() === p) App.render();
      var reason = recordErrorText(e);
      if (RECORD_INPUT_ERRORS.some(function (re) { return re.test(reason); })) {
        App.toast('저장하지 못했어요 · ' + reason);
      } else {
        App.toast('저장하지 못했어요', function () { if (self.cur() === p) self.save(close); }, '다시 시도');
      }
    });
  },
  /** 내역 수정 저장 (작업 12): 그 id 줄만 고친다. 들어온 화면(내역·거래 상세)으로 돌아가 "변경했어요 · A원 → B원" */
  saveEdit: function () {
    var p = this.cur(); if (!p || p.saving) return;
    if (App.syncToday()) return;
    if (this.blockedDate(p.f.date)) return; // 날짜를 예산 없는 미래 달로 옮김 (#70)
    var f = p.f, n = Number(f.amount || 0);
    if (!n) return;
    if (!f.category || !this.hasCat(f.type, f.category)) { this.catSheet(); return; }
    if (!f.payMethod || !this.hasPay(f.payMethod)) { this.paySheet(); return; }
    // edit: 그사이 다른 기기에서 지웠으면 서버가 새로 넣지 않고 '찾을 수 없습니다' (작업 12 고침)
    var input = { id: p.id, edit: true, date: f.date, type: f.type, category: f.category, payMethod: f.payMethod, amount: n, memo: f.memo };
    var self = this, before = p.orig.amount;
    p.saving = 'done';
    App.render();
    App.call('api_saveTxn', input).then(function (r) {
      p.saving = false;
      App.invalidateLoads();
      App.replaceTxns(r.txns); // 마지막에 쓴 값(lastPick)은 바꾸지 않는다 — 새 기록만 (피드백 #62)
      if (self.cur() === p) App.back();
      else App.render();
      App.toast(App.roundOnly(r.txns[0]) + '변경했어요' + (before !== n ? ' · ' + App.won(before) + ' → ' + App.won(n) : ''));
    }, function (e) {
      p.saving = false;
      if (self.cur() === p) App.render();
      var reason = recordErrorText(e);
      if (/찾을 수 없습니다/.test(reason)) {
        // 다른 기기에서 지운 거래: 장부에서도 빼고 들어온 화면으로
        App.invalidateLoads();
        App.state.book.txns = App.state.book.txns.filter(function (t) { return t.id !== p.id; });
        if (self.cur() === p) App.back(); else App.render();
        App.toast('이미 지워진 기록이에요');
        return;
      }
      if (RECORD_INPUT_ERRORS.some(function (re) { return re.test(reason); })) {
        App.toast('저장하지 못했어요 · ' + reason);
      } else {
        App.toast('저장하지 못했어요', function () { if (self.cur() === p) self.saveEdit(); }, '다시 시도');
      }
    });
  },
  /** 기록 완료·추가 기록 뒤 알림의 되돌리기: 방금 저장한 거래를 지운다. 이미 지워졌으면 목록에서만 뺀다 */
  undoSaved: function (txns) {
    var self = this;
    var ids = txns.map(function (t) { return t.id; });
    var t = txns[0];
    var total = txns.reduce(function (s, x) { return s + x.amount; }, 0); // 할부면 모든 회차의 합 = 총액
    var drop = function () {
      App.invalidateLoads();
      var book = App.state.book;
      book.txns = book.txns.filter(function (x) { return ids.indexOf(x.id) < 0; });
      book.installs = dropFromInstalls(book.installs || [], ids);
      App.render();
    };
    App.call('api_deleteTxns', ids).then(function () {
      drop();
      App.toast((t.memo || t.category) + ' ' + App.won(total) + (txns.length > 1 ? ' 할부' : '') + ' 기록을 되돌렸어요');
    }, function (e) {
      if (/찾을 수 없습니다/.test(recordErrorText(e))) { drop(); App.toast('이미 지워진 기록이에요'); return; }
      App.toast('되돌리지 못했어요', function () { self.undoSaved(txns); }, '다시 시도');
    });
  },
};

App.actions.recType = function (d) {
  var p = App.screens.record.cur(); if (!p || p.f.type === d.type || p.mode === 'edit') return;
  p.f.type = d.type;
  if (d.type === '수입') p.f.months = 1; // 할부는 지출만
  if (!App.screens.record.hasCat(d.type, p.f.category)) p.f.category = App.screens.record.defaultCat(d.type);
  if (!p.payTouched) p.f.payMethod = App.screens.record.defaultPay(d.type); // 직접 고르지 않았으면 그 유형의 마지막 수단
  App.render();
};
App.actions.recChip = function (d) {
  var R = App.screens.record, p = R.cur(); if (!p) return;
  var c = (p.chips || [])[Number(d.i)]; if (!c) return;
  p.f.amount = String(c.amount);
  if (R.hasCat(p.f.type, c.category)) p.f.category = c.category;
  if (R.hasPay(c.payMethod)) { p.f.payMethod = c.payMethod; p.payTouched = true; }
  p.f.memo = c.memo;
  App.render();
};
App.actions.recCatSheet = function () { App.screens.record.catSheet(); };
App.actions.recDaySheet = function () { App.screens.record.daySheet(); };
App.actions.recPaySheet = function () { App.screens.record.paySheet(); };
App.actions.recMemoSheet = function () { App.screens.record.memoSheet(); };
App.actions.recPickCat = function (d) { App.screens.record.set({ category: d.name }); };
/** 날짜 창에서 날을 누르면 고른 날 표시만 옮긴다 (#91). 예산 없는 미래 달은 알리고 고르지 않는다 (#70) */
App.actions.recPickDay = function (d) {
  var R = App.screens.record, p = R.cur(); if (!p || !p.dayYm) return;
  if (R.blockedDate(d.date)) return;
  p.dayPick = d.date;
  R.daySheet(p.dayYm);
};
/** 날짜 창의 확인: 고른 날을 반영하고 닫는다 (#91) */
App.actions.recDayOk = function () {
  var R = App.screens.record, p = R.cur(); if (!p) return;
  var date = p.dayPick || p.f.date;
  if (R.blockedDate(date)) return;
  R.set({ date: date });
};
/** 날짜 창의 ‹ › : 보고 있는 달을 옮겨 다시 연다 (#87) */
App.actions.recDayMonth = function (d) {
  var R = App.screens.record, p = R.cur(); if (!p || !p.dayYm) return;
  R.daySheet(addMonths(p.dayYm.year, p.dayYm.month, Number(d.d)));
};
App.actions.recMonths = function (d) {
  var R = App.screens.record, p = R.cur(); if (!p || !R.canInst(p) || !R.isCard(p.f.payMethod)) return;
  R.set({ months: Number(d.n) || 1 });
};
App.actions.recMore = function () { App.screens.record.save(false); };
App.actions.recDone = function () { App.screens.record.save(true); };
</script>

  <script>
/**
 * 거래 내역 탭 (작업 12, spec §1 거래 내역 · §2.4 고치기·취소·삭제 · design §2 내역에서 바로 변경·취소·삭제).
 * 머리(거래 내역 · +) · 달 이동 ‹ 2026년 11월 › · 이번 달 지출·수입 · 칩(전체·지출·수입 · 결제 수단) ·
 * 카테고리 필터("외식·카페 내역만 ×", 리포트가 App.go('history', { category }) 로 연다) · 날짜별 묶음과 그날 지출 합계.
 * 줄을 누르면 그 줄 아래 [변경 · 취소(취소 풀기) · 삭제 · 자세히] (한 번에 한 줄만).
 * 돋보기 → 검색 화면 (작업 16, Search.html). 계산은 Month.js historyGroups.
 * 취소·삭제는 App.txCancel · App.txDelete (거래 상세도 쓴다).
 */
App.state.hist = { year: 0, month: 0, type: '', pay: '', category: '', open: null };

App.screens.history = {
  /** 탭에 들어올 때 (App.setTab · App.go('history', { category, year?, month? })) */
  enter: function (params) {
    var h = this.st();
    h.open = null;
    if (params.category !== undefined) { h.category = params.category || ''; h.type = ''; h.pay = ''; } // 리포트에서 올 때: 다른 필터는 풀어 리포트 합계·건수와 같게 (인수 11)
    if (params.year && params.month) { h.year = Number(params.year); h.month = Number(params.month); }
  },
  /** 내역 탭 상태. 처음에는 이번 달 */
  st: function () {
    var h = App.state.hist;
    if (!h.year) { h.year = App.state.ym.year; h.month = App.state.ym.month; }
    return h;
  },
  render: function () {
    var h = this.st(), book = App.state.book;
    var g = historyGroups(book, h.year, h.month, { type: h.type || undefined, payMethod: h.pay || undefined, category: h.category || undefined });
    var thisMonth = h.year === App.state.ym.year && h.month === App.state.ym.month;
    var out = App.head('거래 내역', { right: '<button class="icon-btn" data-act="searchOpen" aria-label="검색">' + App.icon('search') + '</button>' }); // 돋보기 → 검색 (작업 16, Search.html)

    out += '<div class="pill month-nav"><button' + App.data({ act: 'histMonth', d: -1 }) + ' aria-label="이전 달">' + App.icon('left') + '</button>' +
      '<span class="num">' + h.year + '년 ' + h.month + '월</span>' +
      '<button' + App.data({ act: 'histMonth', d: 1 }) + ' aria-label="다음 달">' + App.icon('right') + '</button></div>';

    out += '<div class="card soft hist-sum"><div><div class="meta green">' + (thisMonth ? '이번 달' : h.month + '월') + ' 지출</div>' +
      '<div class="mid num">' + App.won(g.expense) + '</div></div>' +
      '<div class="hist-inc"><div class="meta green">수입</div><div class="num green">' + App.won(g.income) + '</div></div></div>';

    out += '<div class="chips hist-chips">' + [['', '전체'], ['지출', '지출'], ['수입', '수입']].map(function (c) {
      var on = h.type === c[0];
      return '<button class="chip' + (on ? ' on' : '') + '"' + (on ? ' aria-pressed="true"' : '') + App.data({ act: 'histType', type: c[0] }) + '>' + c[1] + '</button>';
    }).join('') + '<span class="spacer"></span>' +
      '<button class="chip shrink pay-chip' + (h.pay ? ' soft-on' : '') + '" data-act="histPaySheet"><span>' + App.esc(h.pay || '결제 수단') + '</span>' + App.icon('down') + '</button></div>';

    if (h.category) {
      var sum = g.expense + g.income;
      out += '<div class="chips hist-chips cat-filter"><button class="chip on" data-act="histCatClear" aria-label="' + App.esc(h.category) + ' 필터 풀기">' +
        App.esc(h.category) + ' 내역만 ' + App.icon('x') + '</button><span class="meta sub">' + g.count + '건 · ' + App.won(sum) + '</span></div>';
    }

    g.days.forEach(function (d) {
      var sumText = h.type === '수입' ? (d.income ? '<span class="num green">' + App.won(d.income) + '</span>' : '')
        : (d.total ? '<span class="num">' + App.won(d.total) + '</span>' : '');
      out += '<div class="day-head"><span>' + App.esc(App.dateLabel(d.date)) + '</span>' + sumText + '</div>';
      d.txns.forEach(function (t) {
        var open = h.open === t.id;
        out += '<div class="tx-card' + (open ? ' open' : '') + '">' + App.txRow(t, { act: 'histToggle', expanded: open }) +
          (open ? App.screens.history.acts(t) : '') + '</div>';
      });
    });
    if (!g.days.length) out += '<p class="sub hist-empty">조건에 맞는 내역이 없어요</p>';
    out += '<p class="sub meta hist-hint">내역을 누르면 바로 변경·취소·삭제할 수 있어요</p>';
    return out;
  },
  /** 줄 아래 [변경 · 취소(취소 풀기) · 삭제 · 자세히] */
  acts: function (t) {
    return '<div class="tx-acts">' +
      '<button' + App.data({ act: 'histEdit', id: t.id }) + '>' + App.icon('pencil') + '변경</button>' +
      '<button' + App.data({ act: 'txCancel', id: t.id }) + '>' + App.icon(t.canceled ? 'undo' : 'cancel') + (t.canceled ? '취소 풀기' : '취소') + '</button>' +
      '<button class="danger"' + App.data({ act: 'txDelete', id: t.id }) + '>' + App.icon('trash') + '삭제</button>' +
      '<button' + App.data({ act: 'detail', id: t.id }) + '>' + App.icon('right') + '자세히</button></div>';
  },
  paySheet: function () {
    var h = this.st();
    var list = [['', '전체']].concat(App.pays().map(function (p) { return [p.name, p.name, p.kind]; }));
    App.sheet('결제 수단', '<div class="rows">' + list.map(function (x) {
      return '<button class="r"' + App.data({ act: 'histPickPay', name: x[0] }) + '><span class="pick-l">' +
        (x[2] ? App.payTile(x[2]) : '<span class="tile pay-tile">' + App.icon('dots') + '</span>') + App.esc(x[1]) + '</span>' +
        '<span class="v">' + (h.pay === x[0] ? App.icon('check') : '') + '</span></button>';
    }).join('') + '</div>');
  },
};

/* ---------- 거래 하나 찾기 · 할부 회차 문구 ---------- */

App.txnById = function (id) {
  return ((App.state.book && App.state.book.txns) || []).filter(function (t) { return t.id === id; })[0] || null;
};
/** 할부 회차면 '2회차만 ' (알림 머리, design §2 "그 회차만"), 아니면 '' */
App.roundOnly = function (t) {
  var k = t && t.inst ? parseInt(String(t.inst).split('/')[0], 10) : 0;
  return k > 0 ? k + '회차만 ' : '';
};
/** 서버가 돌려준 거래로 장부의 같은 번호 줄을 바꾼다 (자리는 그대로) */
App.replaceTxns = function (txns) {
  var map = {};
  txns.forEach(function (t) { map[t.id] = t; });
  App.state.book.txns = App.state.book.txns.map(function (t) { return map[t.id] || t; });
};

/**
 * 취소 ↔ 취소 풀기 (spec §2.4). 화면은 바로 바꾸고(낙관적), 서버 결과로 맞춘다. 실패하면 되돌린다.
 * 알림 "취소했어요" / "취소를 풀었어요" (할부 회차면 "2회차만 …") + 되돌리기(바꾸기 전 값으로 — 그사이 또 바뀌었으면 그 값이 이미 맞을 때 아무것도 안 함).
 * quiet: 알림 없이, target: 정할 값(없으면 지금의 반대)
 */
App.txCancel = function (id, quiet, target) {
  var t = App.txnById(id); if (!t || App._txBusy) return;
  var want = typeof target === 'boolean' ? target : !t.canceled;
  if (t.canceled === want) { App.render(); return; } // 되돌리기: 이미 그 값이면 할 일 없음
  App._txBusy = true;
  App.invalidateLoads();
  t.canceled = want;
  App.render();
  App.call('api_setCanceled', [id], want).then(function (r) {
    App._txBusy = false;
    App.invalidateLoads();
    App.replaceTxns(r || []);
    App.render();
    if (quiet) return;
    App.toast(App.roundOnly(t) + (want ? '취소했어요' : '취소를 풀었어요'), function () { App.txCancel(id, true, !want); }); // 이전 값으로
  }, function (e) {
    App._txBusy = false;
    var cur = App.txnById(id);
    if (cur) cur.canceled = !want;
    App.render();
    App.toast('바꾸지 못했어요 · ' + recordErrorText(e));
  });
};

/**
 * 삭제 (spec §2.4): 서버에서 지운 뒤 장부에서 빼고 "삭제했어요 · 되돌리기"(4초).
 * 되돌리기는 같은 번호로 다시 넣는다(api_restoreTxns) — 장부의 원래 자리와 할부 묶음도 그대로.
 * after: 지운 뒤 할 일 (거래 상세는 닫는다)
 */
App.txDelete = function (id, after) {
  var t = App.txnById(id); if (!t || App._txBusy) return;
  App._txBusy = true;
  App.call('api_deleteTxns', [id]).then(function (r) {
    App._txBusy = false;
    App.invalidateLoads();
    var book = App.state.book;
    var at = book.txns.map(function (x) { return x.id; }).indexOf(id);
    book.txns = book.txns.filter(function (x) { return x.id !== id; });
    var hit = (r.installs || []).map(function (x) { return x.id; });
    book.installs = dropFromInstalls(book.installs || [], [id]);
    applyRenumber(book, book.installs.filter(function (x) { return hit.indexOf(x.id) >= 0; })); // 남은 회차는 남은 것만으로 다시 센다 (#94)
    if (App.state.hist.open === id) App.state.hist.open = null;
    if (after) after(); else App.render();
    App.toast(App.roundOnly(t) + '삭제했어요', function () { App.txRestore(r.removed, r.installs, at); });
  }, function (e) {
    App._txBusy = false;
    var reason = recordErrorText(e);
    if (/찾을 수 없습니다/.test(reason)) {
      App.invalidateLoads();
      App.state.book.txns = App.state.book.txns.filter(function (x) { return x.id !== id; });
      if (after) after(); else App.render();
      App.toast('이미 지워진 내역이에요');
      return;
    }
    App.toast('삭제하지 못했어요 · ' + reason);
  });
};
/** 삭제 되돌리기: 서버에 같은 번호로 다시 넣고, 장부의 원래 자리(at)에 돌려놓는다 */
App.txRestore = function (removed, installs, at) {
  App.call('api_restoreTxns', removed, installs).then(function () {
    App.invalidateLoads();
    var book = App.state.book;
    var have = {};
    book.txns.forEach(function (x) { have[x.id] = true; });
    var back = removed.filter(function (x) { return !have[x.id]; });
    var pos = at >= 0 && at <= book.txns.length ? at : 0;
    book.txns = book.txns.slice(0, pos).concat(back, book.txns.slice(pos));
    (installs || []).forEach(function (x) {
      book.installs = (book.installs || []).filter(function (y) { return y.id !== x.id; }).concat([x]);
    });
    applyRenumber(book, installs || []); // 되돌린 뒤 전체를 다시 센다 (#94)
    App.render();
    App.toast('되돌렸어요');
  }, function () {
    App.toast('되돌리지 못했어요', function () { App.txRestore(removed, installs, at); }, '다시 시도');
  });
};

App.actions.histMonth = function (d) {
  var h = App.screens.history.st();
  var ym = addMonths(h.year, h.month, Number(d.d));
  h.year = ym.year; h.month = ym.month; h.open = null;
  App.render();
};
App.actions.histType = function (d) { var h = App.screens.history.st(); h.type = d.type; h.open = null; App.render(); };
App.actions.histPaySheet = function () { App.screens.history.paySheet(); };
App.actions.histPickPay = function (d) { var h = App.screens.history.st(); h.pay = d.name; h.open = null; App.closeSheet(); App.render(); };
App.actions.histCatClear = function () { var h = App.screens.history.st(); h.category = ''; h.open = null; App.render(); };
App.actions.histToggle = function (d) { var h = App.screens.history.st(); h.open = h.open === d.id ? null : d.id; App.render(); };
App.actions.histEdit = function (d) { App.go('record', { mode: 'edit', id: d.id, from: 'history' }); };
App.actions.txCancel = function (d) { App.txCancel(d.id); };
App.actions.txDelete = function (d) { App.txDelete(d.id); };
</script>

  <script>
/**
 * 전체 기간 검색 (작업 16, spec §1 검색 · §2.8 · 인수 19 · design §2 전체 기간 검색, 시안 search · searchQ).
 * 내역 탭 돋보기 → 이 화면. 입력칸에 바로 커서. 찾기는 Search.js searchTxns(장부 전체, 화면에서), 찾은 글자는 highlight.
 * - 입력 전: 최근 검색어 칩(이 기기 localStorage, 최대 6개) · "이렇게 찾을 수 있어요"
 * - 결과: 찾은 내역 N건 · 지출 합계(수입 있으면 함께) · 달별 묶음(달마다 건수·합계). 결과 없음: 기간을 넓혀 보라는 안내
 * - 이번 달 줄은 내역과 같은 [변경 · 취소 · 삭제 · 자세히](App.screens.history.acts), 다른 달 줄은 누르면 거래 상세
 * - 최근 검색어는 Enter(검색 키)와 결과 줄을 열 때만 저장한다 (지우기 X·blur 로는 저장하지 않는다)
 * - 입력하는 동안은 결과 칸(#searchRes)만 다시 그린다(150ms 모아서) — 입력칸·키보드는 그대로
 * 화면 상태는 쌓인 화면의 params: { q, period, type, open, focus }
 */
var SEARCH_PERIODS = [['all', '전체 기간'], ['year', '올해'], ['3m', '최근 3개월'], ['month', '이번 달']];
var SEARCH_RECENT_KEY = 'moaa.searchRecent';
var SEARCH_RECENT_MAX = 6;

App.screens.search = {
  cur: function () { var top = App.stack[App.stack.length - 1]; return top && top.name === 'search' ? top.params : null; },
  render: function (p) {
    if (p.q === undefined) { p.q = ''; p.period = 'all'; p.type = 'all'; p.open = null; }
    var period = SEARCH_PERIODS.filter(function (x) { return x[0] === p.period; })[0] || SEARCH_PERIODS[0];
    var h = App.subhead('검색');
    h += '<div class="search-box">' + App.icon('search') +
      '<input id="searchIn" class="search-in" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"' +
      ' maxlength="40" placeholder="메모·카테고리·결제 수단·금액" aria-label="검색어" value="' + App.esc(p.q) + '">' +
      '<button class="icon-btn" data-act="searchClear" aria-label="검색어 지우기"' + (p.q ? '' : ' hidden') + '>' + App.icon('x') + '</button></div>';
    h += '<div class="chips search-chips"><button class="chip on period-chip" data-act="searchPeriodSheet" aria-label="기간: ' + period[1] + '">' +
      period[1] + App.icon('down') + '</button>' +
      [['all', '전체'], ['지출', '지출'], ['수입', '수입']].map(function (c) {
        var on = p.type === c[0];
        return '<button class="chip' + (on ? ' soft-on' : '') + '"' + (on ? ' aria-pressed="true"' : '') + App.data({ act: 'searchType', type: c[0] }) + '>' + c[1] + '</button>';
      }).join('') + '</div>';
    h += '<div id="searchRes">' + this.results(p) + '</div>';
    return h;
  },

  /** 결과 칸 (입력 중에는 이것만 다시 그린다) */
  results: function (p) {
    var q = (p.q || '').trim();
    if (!q) return this.before();
    var r = searchTxns(App.state.book, q, { period: p.period, type: p.type }, App.state.today);
    if (!r.count) {
      return '<div class="note beige search-none"><b>"' + App.esc(q) + '"에 맞는 내역이 없어요</b><span>' +
        (p.period !== 'all' ? '기간을 \'전체 기간\'으로 넓히거나 다른 말로 찾아보세요' : '다른 말로 찾거나 금액은 숫자만 넣어 보세요') + '</span></div>';
    }
    var incOnly = p.type === '수입';
    var h = '<div class="card soft search-sum"><div><div class="meta green">찾은 내역</div><div class="mid num">' + r.count + '건</div></div>' +
      '<div class="search-tot"><div class="meta green">' + (incOnly ? '수입 합계' : '지출 합계') + '</div>' +
      '<div class="num tot' + (incOnly ? ' green' : '') + '">' + App.won(incOnly ? r.income : r.expense) + '</div>' +
      (!incOnly && r.income ? '<div class="meta green num">수입 ' + App.won(r.income) + '</div>' : '') + '</div></div>';
    var ty = Number(App.state.today.slice(0, 4)), thisYm = App.state.today.slice(0, 7), self = this;
    if (p.open && !r.months.some(function (m) { return m.ym === thisYm && m.txns.some(function (t) { return t.id === p.open; }); })) p.open = null;
    r.months.forEach(function (m) {
      var now = m.ym === thisYm;
      var green = incOnly || (!m.expense && m.income);
      h += '<div class="day-head search-month"><span>' + (m.year !== ty ? m.year + '년 ' : '') + m.month + '월' + (now ? ' · 이번 달' : '') + ' · ' + m.count + '건</span>' +
        '<span class="num' + (green ? ' green' : '') + '">' + App.won(green ? m.income : m.total) + '</span></div>';
      m.txns.forEach(function (t) {
        var open = now && p.open === t.id;
        h += '<div class="tx-card' + (open ? ' open' : '') + '">' + self.row(t, q, now, open) + (open ? App.screens.history.acts(t) : '') + '</div>';
      });
    });
    return h;
  },

  /** 거래 줄 (App.txRow 와 같은 모양, 찾은 글자 표시). 이번 달은 누르면 동작 줄, 다른 달은 거래 상세 */
  row: function (t, q, now, open) {
    var d = Number(t.date.slice(5, 7)) + '/' + Number(t.date.slice(8, 10));
    var meta = d + ' · <span class="nw">' + highlight(t.category, q) + '</span> · <span class="nw">' + highlight(t.payMethod, q) + '</span>' +
      (t.auto ? ' · 자동' : '') + (t.inst ? ' · 할부 ' + App.esc(t.inst) : '');
    var digits = q.replace(/[,\s원]/g, '');
    var amt = App.won(t.amount);
    if (/^\d+$/.test(digits) && Number(digits) === Number(t.amount)) amt = '<mark>' + amt + '</mark>';
    return '<button class="tx' + (t.canceled ? ' canceled' : '') + '"' + App.data({ act: now ? 'searchToggle' : 'searchDetail', id: t.id }) +
      (now ? ' aria-expanded="' + !!open + '"' : '') + '>' + App.catTile(t.category) +
      '<span class="t"><b>' + highlight(t.memo || t.category, q) + (t.canceled ? '<span class="tag-cancel">취소</span>' : '') + '</b>' +
      '<span>' + meta + '</span></span>' +
      '<span class="a num' + (t.type === '수입' ? ' green' : '') + '">' + amt + '</span></button>';
  },

  /** 입력 전: 최근 검색어 · 찾을 수 있는 것 안내 (보기는 이 가계부의 카테고리·결제 수단) */
  before: function () {
    var rec = searchRecent(), h = '';
    if (rec.length) {
      h += '<div class="group-label search-label"><span>최근 검색</span><button class="link-btn" data-act="searchRecentClear">모두 지우기</button></div>' +
        '<div class="chips search-recent">' + rec.map(function (x) {
          return '<button class="chip"' + App.data({ act: 'searchRecent', q: x }) + '><span>' + App.esc(x) + '</span></button>';
        }).join('') + '</div>';
    }
    var book = App.state.book || {};
    var cats = (book.categories || []).filter(function (c) { return c.type === '지출'; }).slice(0, 2).map(function (c) { return c.name; });
    var pays = App.pays().slice(0, 2).map(function (x) { return x.name; });
    var ex = [['메모', '커피, 마트'], ['카테고리', cats.join(', ') || '식비, 교통'], ['결제 수단', pays.join(', ') || '신한카드, 현금'], ['금액', '12500 (콤마 없이도 돼요)']];
    return h + '<div class="group-label">이렇게 찾을 수 있어요</div><div class="rows search-how">' + ex.map(function (r) {
      return '<div class="r"><span class="k main">' + r[0] + '</span><span class="v">' + App.esc(r[1]) + '</span></div>';
    }).join('') + '</div>';
  },

  mount: function (el) {
    var p = this.cur(), self = this;
    var input = el.querySelector('#searchIn');
    if (!p || !input) return;
    clearTimeout(App._searchTimer);
    input.addEventListener('input', function () {
      p.q = input.value;
      p.open = null;
      var clear = el.querySelector('[data-act=searchClear]');
      if (clear) clear.hidden = !p.q;
      clearTimeout(App._searchTimer);
      App._searchTimer = setTimeout(function () {
        if (self.cur() !== p) return;
        var res = document.getElementById('searchRes');
        if (res) res.innerHTML = self.results(p);
      }, 150);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      searchRemember(input.value);
      input.blur(); // 키보드를 닫아 결과를 보이게
    });
    input.addEventListener('focus', function () { setTimeout(function () { searchReveal(input); }, 320); });
    // 돋보기로 처음 열 때만 커서 (누른 동작 안에서 바로 focus 해야 iOS 가 키보드를 연다). 글 끝에 커서
    if (p.focus) {
      p.focus = false;
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* 일부 브라우저 */ }
    }
  },
};

/** 키보드가 올라온 뒤 입력칸이 보이는 곳 밖이면 맨 위로 (입력칸·결과 머리가 화면 위쪽에 있다) */
function searchReveal(input) {
  if (document.activeElement !== input) return;
  var vv = window.visualViewport;
  var top = vv ? vv.offsetTop : 0, bottom = top + (vv ? vv.height : window.innerHeight);
  var r = input.getBoundingClientRect();
  if (r.top < top + 48 || r.bottom > bottom - 8) window.scrollTo(0, 0);
}

/* ---------- 최근 검색어 (이 기기만. 저장소를 못 쓰면 이번에 연 동안만 기억) ---------- */

App._searchRecentMem = [];
function searchRecent() {
  try {
    var v = JSON.parse(window.localStorage.getItem(SEARCH_RECENT_KEY) || '[]');
    if (Object.prototype.toString.call(v) === '[object Array]') return v.filter(function (x) { return typeof x === 'string' && x; }).slice(0, SEARCH_RECENT_MAX);
  } catch (e) { /* 저장소 막힘(비공개 모드 등) */ }
  return App._searchRecentMem.slice();
}
function searchRemember(q) {
  q = String(q || '').trim();
  if (!q) return;
  var list = [q].concat(searchRecent().filter(function (x) { return x !== q; })).slice(0, SEARCH_RECENT_MAX);
  App._searchRecentMem = list;
  try { window.localStorage.setItem(SEARCH_RECENT_KEY, JSON.stringify(list)); } catch (e) { /* 저장소 막힘 */ }
}
function searchForget() {
  App._searchRecentMem = [];
  try { window.localStorage.removeItem(SEARCH_RECENT_KEY); } catch (e) { /* 저장소 막힘 */ }
}

App.actions.searchOpen = function () { App.go('search', { from: 'history', focus: true }); };
App.actions.searchClear = function () {
  var p = App.screens.search.cur(); if (!p) return;
  p.q = ''; p.open = null; p.focus = true;
  App.render();
};
App.actions.searchType = function (d) { var p = App.screens.search.cur(); if (!p) return; p.type = d.type; p.open = null; App.render(); };
App.actions.searchPeriodSheet = function () {
  var p = App.screens.search.cur(); if (!p) return;
  App.sheet('기간', '<div class="rows">' + SEARCH_PERIODS.map(function (x) {
    return '<button class="r"' + App.data({ act: 'searchPeriod', period: x[0] }) + '><span>' + x[1] + '</span>' +
      '<span class="v">' + (p.period === x[0] ? App.icon('check') : '') + '</span></button>';
  }).join('') + '</div>');
};
App.actions.searchPeriod = function (d) { var p = App.screens.search.cur(); if (!p) return; p.period = d.period; p.open = null; App.closeSheet(); App.render(); };
App.actions.searchRecent = function (d) {
  var p = App.screens.search.cur(); if (!p) return;
  p.q = d.q; p.open = null;
  searchRemember(d.q);
  App.render();
};
App.actions.searchDetail = function (d) {
  var p = App.screens.search.cur(); if (p) searchRemember(p.q);
  App.go('detail', { id: d.id });
};
App.actions.searchRecentClear = function () { searchForget(); App.render(); };
App.actions.searchToggle = function (d) {
  var p = App.screens.search.cur(); if (!p) return;
  searchRemember(p.q); // 결과 줄을 열 때도 최근 검색어로 (X 로 지울 때는 저장하지 않는다)
  p.open = p.open === d.id ? null : d.id;
  App.render();
};
</script>

  <script>
/**
 * 거래 상세 (작업 12, spec §1 거래 상세 · design §2 거래 수정). 내역의 "자세히"·홈 최근 내역에서 연다.
 * 영수증(카테고리 · 금액 · 메모) · 거래 날짜 · 결제 수단(+ "· 3개월 할부") · 거래 유형 · 할부 "할부 3회 중 1회차 · 총 N원" ·
 * 이 내역이 포함된 카테고리 예산(그 달: 남은 금액 또는 초과 · 막대 · 사용/예산) · 안내 · [취소로 표시(취소 풀기) · 삭제] ·
 * 아래 고정 [내역 수정] (= 변경, 기록 화면 mode 'edit').
 * 할부 회차면 "할부 전체 보기 · 회차별로 고치기" → 할부 상세(plan, 작업 13). 삭제는 묻지 않고 상세를 닫은 뒤 알림의 되돌리기(4초).
 * 계산은 Month.js monthSummary·budgetOf·overText, Install.js installOf·installStatus.
 */
App.screens.detail = {
  render: function (p) {
    var t = App.txnById(p.id);
    var h = App.subhead('거래 상세');
    if (!t) return h + '<div class="note beige"><b>이 내역을 찾을 수 없어요</b><span>지웠거나 다른 기기에서 바뀌었을 수 있어요</span></div>';
    var book = App.state.book, inc = t.type === '수입';
    var y = Number(t.date.slice(0, 4)), m = Number(t.date.slice(5, 7));
    var ins = t.inst ? installOf(book, t.id) : null;

    h += '<div class="receipt' + (t.canceled ? ' canceled' : '') + '"><span class="tag">' + App.esc(t.category) + (t.canceled ? ' · 취소됨' : '') + '</span>' +
      '<div class="big num' + (inc ? ' green' : '') + '">' + App.won(t.amount) + '</div>' +
      '<p>' + App.esc(t.memo || t.category) + (t.canceled ? ' · 합계에서 빠졌어요' : '') + '</p></div>';

    var rows = [
      ['거래 날짜', App.screens.record.dateText(t.date)],
      [inc ? '받은 수단' : '결제 수단', t.payMethod + (ins ? ' · ' + ins.months + '개월 할부' : '')],
      ['거래 유형', t.type + (t.auto ? ' · 자동 기록' : '')],
    ];
    if (ins) {
      var st = installStatus(book, ins, App.state.today);
      var k = parseInt(String(t.inst).split('/')[0], 10);
      rows.push(['할부', '할부 ' + ins.months + '회 중 ' + k + '회차 · 총 ' + App.won(st.total)]);
    }
    h += '<div class="rows detail-rows">' + rows.map(function (r) {
      return '<div class="r"><span class="k">' + r[0] + '</span><span class="v">' + App.esc(r[1]) + '</span></div>';
    }).join('') + (ins ? '<button class="r"' + App.data({ act: 'planOpen', id: ins.id }) + '><span class="k main">할부 전체 보기 · 회차별로 고치기</span>' +
      '<span class="v">' + App.icon('right') + '</span></button>' : '') + '</div>';

    if (!inc) h += this.budgetCard(book, y, m, t.category);

    h += '<div class="note beige"><b>잘못 기록해도 괜찮아요</b><span>금액 · 카테고리 · 날짜 · 결제 수단 · 메모를 바꿀 수 있어요. 환불·취소는 \'취소\'로 표시해요</span></div>';
    h += '<div class="text-actions detail-acts"><button' + App.data({ act: 'txCancel', id: t.id }) + '>' + (t.canceled ? '취소 풀기' : '취소로 표시') + '</button>' +
      '<button class="danger"' + App.data({ act: 'detailDelete', id: t.id }) + '>삭제</button></div>';
    h += '<div class="bottom-btn"><button class="btn"' + App.data({ act: 'detailEdit', id: t.id }) + '>내역 수정</button></div>';
    return h;
  },

  /** 이 내역이 포함된 카테고리 예산 (그 달). 취소한 거래는 사용에서 빠진다 */
  budgetCard: function (book, y, m, category) {
    var line = monthSummary(book, y, m).lines.filter(function (l) { return l.category === category; })[0];
    var budget = line ? line.budget : budgetOf(book, y, m, category);
    var spent = line ? line.spent : 0;
    var left = budget - spent;
    var thisMonth = y === App.state.ym.year && m === App.state.ym.month;
    var title = '이 내역이 포함된 ' + (thisMonth ? '' : (y !== App.state.ym.year ? y + '년 ' : '') + m + '월 ') + category + ' 예산';
    var mid;
    if (left < 0) {
      var parts = overText(left, budget).split(' · '); // ['초과 12,000원', '4% 초과']
      mid = '<span class="meta over">' + (parts[1] || '예산 0원') + '</span><span class="mid num over">' + parts[0] + '</span>';
    } else {
      mid = '<span class="meta green">남은 금액</span><span class="mid num">' + App.won(left) + '</span>';
    }
    return '<div class="card soft detail-budget"><div class="label">' + App.esc(title) + '</div>' +
      '<div class="row-between db-mid">' + mid + '</div>' + App.bar(spent, budget) +
      '<div class="row-between meta db-foot"><span class="sub">사용 ' + App.won(spent) + '</span><span class="green">예산 ' + App.won(budget) + '</span></div></div>';
  },
};

App.actions.detailEdit = function (d) { App.go('record', { mode: 'edit', id: d.id }); };
/** 삭제: 묻지 않고 지운 뒤 상세를 닫는다 (들어온 화면으로) + 되돌리기 */
App.actions.detailDelete = function (d) {
  App.txDelete(d.id, function () {
    var top = App.stack[App.stack.length - 1];
    if (top && top.name === 'detail' && top.params.id === d.id) App.back();
    else App.render();
  });
};
</script>

  <script>
/**
 * 할부 · 할부 상세 (작업 13, spec §1 할부·할부 상세 · §2.6 · design §2 할부, 시안 installsScreen · planScreen).
 * 할부(installs): 홈의 "남은 할부" 카드에서. 남은 할부 합계 · 다음 달 금액 · 달마다 미리 기록된 할부(누르면 그 달 내역) ·
 *   진행 중인 할부(월 금액 · 총액 · 지난 회차 막대 k/N · 남은 금액 · 끝나는 달) → 할부 상세.
 * 할부 상세(plan, { id }): 진행 중인 할부 또는 거래 상세의 "할부 전체 보기"에서. 합계(취소 회차 제외) · 회차 목록(골라서) ·
 *   아래 [금액 고치기(1개 골랐을 때만) · 취소/취소 풀기 · 삭제 N]. 삭제는 확인 시트 → 알림의 되돌리기.
 *   회차 하나하나가 그 달의 독립 거래다(서버는 id 줄만 고친다). 회차를 모두 지우면 할부도 없어져 할부 화면으로 돌아간다.
 * 계산은 Install.js remainingInstallments · installStatus. 합계·남은 금액은 남은 회차로 다시 센다(취소 회차 제외).
 */

/** '2026-12' → '12월' (올해) · '2027년 1월' */
function instYmLabel(ym) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  return (y !== App.state.ym.year ? y + '년 ' : '') + m + '월';
}

App.screens.installs = {
  render: function () {
    var book = App.state.book, today = App.state.today;
    var sum = remainingInstallments(book, today);
    var active = this.active(book, today);
    var h = App.subhead('할부');

    h += '<div class="card soft inst-sum"><div class="label">남은 할부 · 이미 쓴 미래 지출</div>' +
      '<div class="big num">' + App.won(sum.total) + '</div>' +
      '<div class="meta green">' + active.length + '건 진행 중' + (sum.nextMonth ? ' · 다음 달 ' + App.won(sum.nextMonth) + ' 나가요' : '') + '</div></div>';

    if (sum.byMonth.length) {
      var max = Math.max.apply(null, sum.byMonth.map(function (x) { return x.amount; }).concat([1]));
      h += '<div class="section"><h2>달마다 미리 기록된 할부</h2><span class="more">다음 달부터</span></div><div class="card inst-months">' +
        sum.byMonth.map(function (x) {
          return '<button class="inst-month"' + App.data({ act: 'instMonth', ym: x.ym }) + ' aria-label="' + instYmLabel(x.ym) + ' 내역 보기">' +
            '<span class="im-l">' + instYmLabel(x.ym) + '<small>' + x.txns.length + '건</small></span>' +
            '<span class="bar"><i style="width:' + Math.round(x.amount / max * 100) + '%"></i></span><b class="num">' + App.won(x.amount) + '</b></button>';
        }).join('') + '</div>';
    }

    h += '<div class="section"><h2>진행 중인 할부</h2><span class="more">' + active.length + '건</span></div>';
    if (!active.length) {
      h += '<div class="card inst-empty sub">진행 중인 할부가 없어요</div>';
    } else {
      h += '<div class="list-card inst-list">' + active.map(function (a) { return App.screens.installs.item(a); }).join('') + '</div>';
    }
    h += '<div class="note beige"><b>할부는 이미 쓴 돈이에요</b><span>기록할 때 결제 수단에서 개월 수를 고르면, 총액을 나눠 이번 달과 앞으로의 달에 미리 기록해요. ' +
      '할부를 누르면 회차(월)를 골라 고치거나 취소하거나 지울 수 있어요.</span></div>';
    return h;
  },

  /** 진행 중인 할부: 오늘 뒤에 남은 금액이 있는 것. [{ ins, st }] (book.installs 순서) */
  active: function (book, today) {
    return (book.installs || []).map(function (ins) { return { ins: ins, st: installStatus(book, ins, today) }; })
      .filter(function (a) { return a.st.left > 0; });
  },

  /** 진행 중인 할부 한 줄: 제목 · 남은 금액 / 결제 수단 · 총액 / 지난 회차 막대 / k/N회 지남 · 다음 회차 금액 · 끝나는 달 (피드백 #63) */
  item: function (a) {
    var st = a.st, rounds = st.rounds, first = rounds[0].txn;
    var live = rounds.filter(function (r) { return !r.txn.canceled; });
    var next = live.filter(function (r) { return !r.past; })[0];
    var done = rounds.filter(function (r) { return r.past; }).length;
    return '<button class="ana"' + App.data({ act: 'planOpen', id: a.ins.id }) + '>' + App.catTile(first.category) + '<span class="ana-main">' +
      '<span class="row-between"><b>' + App.esc(a.ins.title) + '</b><span class="ana-rate num">남은 ' + App.won(st.left) + '</span></span>' +
      '<span class="ana-sub">' + App.esc(first.payMethod) + ' · 총액 ' + App.won(st.total) + '</span>' +
      App.bar(done, rounds.length, 'thin') +
      '<span class="ana-meta"><span><em class="num">' + done + '/' + rounds.length + '</em>회 지남</span>' +
      (next ? '<span>다음 <em class="num">' + App.won(next.txn.amount) + '</em></span>' : '') +
      '<span><em>' + instYmLabel(st.endYm) + '</em> 끝</span></span>' +
      '</span>' + App.icon('right', 'sub') + '</button>';
  },
};

App.screens.plan = {
  /** 지금 맨 위 화면이 할부 상세면 그 params */
  cur: function () {
    var top = App.stack[App.stack.length - 1];
    return top && top.name === 'plan' ? top.params : null;
  },
  ins: function (id) {
    return ((App.state.book && App.state.book.installs) || []).filter(function (x) { return x.id === id; })[0] || null;
  },
  /** 고른 회차 (남아 있는 것만, 회차 순서) */
  selected: function (p) {
    var ins = this.ins(p.id); if (!ins) return [];
    p.sel = p.sel || {};
    return installStatus(App.state.book, ins, App.state.today).rounds.filter(function (r) { return p.sel[r.txn.id]; });
  },
  state: function (t) {
    var ym = t.date.slice(0, 7), now = App.state.today.slice(0, 7);
    return t.canceled ? '취소됨' : ym < now ? '지난 달' : ym === now ? '이번 달' : '미리 기록';
  },

  render: function (p) {
    var ins = this.ins(p.id);
    if (!ins) return App.subhead('할부 상세') + '<div class="note beige"><b>이 할부를 찾을 수 없어요</b><span>회차를 모두 지웠거나 다른 기기에서 바뀌었을 수 있어요</span></div>';
    p.sel = p.sel || {};
    var self = this, st = installStatus(App.state.book, ins, App.state.today);
    var sel = this.selected(p), n = sel.length, all = n === st.rounds.length;
    var first = st.rounds.length ? st.rounds[0].txn : null;
    var h = App.subhead(ins.title + ' 할부');

    var meta = [];
    if (first) meta.push(first.category, first.payMethod);
    meta.push(st.rounds.length + '회' + (st.rounds.length !== ins.months ? ' (처음 ' + ins.months + '회)' : ''));
    meta.push('남은 금액 ' + App.won(st.left));
    if (st.endYm) meta.push(instYmLabel(st.endYm) + ' 끝');
    h += '<div class="card soft inst-sum"><div class="label">할부 합계 · 취소 회차 제외</div><div class="big num">' + App.won(st.total) + '</div>' +
      '<div class="meta green">' + App.esc(meta.join(' · ')) + '</div></div>';

    h += '<div class="section"><h2>회차</h2><button class="more" data-act="planAll">' + (all ? '선택 해제' : '전체 선택') + '</button></div>';
    h += '<div class="list-card plan-list">' + st.rounds.map(function (r) {
      var t = r.txn, on = !!p.sel[t.id];
      return '<button class="part' + (on ? ' on' : '') + (t.canceled ? ' canceled' : '') + '"' + App.data({ act: 'planToggle', id: t.id }) +
        ' aria-pressed="' + on + '"><span class="box' + (on ? ' on' : '') + '"></span>' +
        '<span class="t"><b>' + r.k + '회차' + (t.canceled ? '<span class="tag-cancel">취소</span>' : '') + '</b>' +
        '<span>' + App.screens.record.dateText(t.date) + ' · ' + self.state(t) + '</span></span>' +
        '<span class="a num">' + App.won(t.amount) + '</span></button>';
    }).join('') + '</div>';
    h += '<p class="meta sub plan-hint">회차 하나하나가 그 달의 기록이에요. 내역에서 고쳐도 여기에 똑같이 반영돼요.</p>';

    var undo = n && sel.every(function (r) { return r.txn.canceled; });
    h += '<div class="bottom-btn"><div class="sel-bar">' +
      '<button data-act="planAmount"' + (n === 1 ? '' : ' disabled') + '>' + App.icon('pencil') + '금액 고치기</button>' +
      '<button data-act="planCancel"' + (n ? '' : ' disabled') + '>' + App.icon(undo ? 'undo' : 'cancel') + (undo ? '취소 풀기' : '취소') + '</button>' +
      '<button class="danger" data-act="planDelete"' + (n ? '' : ' disabled') + '>' + App.icon('trash') + '삭제' + (n ? ' ' + n : '') + '</button></div></div>';
    return h;
  },

  /* ---------- 금액 고치기 (1개) ---------- */

  amountSheet: function () {
    var p = this.cur(); if (!p) return;
    var r = this.selected(p)[0]; if (!r) return;
    var t = r.txn;
    App.sheet(r.k + '회차 금액 (' + Number(t.date.slice(0, 4)) + '년 ' + Number(t.date.slice(5, 7)) + '월)',
      '<input class="text num" id="planAmt" inputmode="numeric" enterkeyhint="done" aria-label="회차 금액" value="' + App.esc(won(t.amount).replace(/원$/, '')) + '"' +
      ' oninput="App.screens.plan.fmtInput(this)" onkeydown="if (event.key === \'Enter\') { event.preventDefault(); this.blur(); }">' +
      '<p class="meta sub plan-sheet-p">이 회차만 바뀌어요. 다른 회차는 그대로예요.</p>' +
      '<button class="btn" id="planAmtBtn" onclick="App.screens.plan.saveAmount()">고치기</button>', 'planAmt');
  },
  /** 입력칸: 숫자만, 쉼표 (최대 10자리) */
  fmtInput: function (el) {
    var d = amountDigits(el.value, RECORD_MAX_DIGITS, el._prevDigits || '');
    el._prevDigits = d;
    el.value = d ? won(Number(d)).replace(/원$/, '') : '';
  },
  saveAmount: function () {
    var p = this.cur(); if (!p) return;
    var r = this.selected(p)[0]; if (!r) return;
    var el = document.getElementById('planAmt');
    var v = Number(amountDigits(el ? el.value : '', RECORD_MAX_DIGITS));
    if (!(v >= 1)) { App.toast('금액을 입력해 주세요'); return; }
    if (v === r.txn.amount) { App.closeSheet(); return; }
    var btn = document.getElementById('planAmtBtn');
    if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '고치는 중…'; }
    this.setAmount(r.txn.id, v, p);
  },
  /** 그 회차(id 줄)만 금액을 바꾼다 (api_saveTxn edit). 알림 "2회차 A원 → B원 · 되돌리기" */
  setAmount: function (id, amount, p, quiet) {
    var t = App.txnById(id); if (!t || App._txBusy) return;
    var self = this, before = t.amount, k = parseInt(String(t.inst).split('/')[0], 10) || '';
    App._txBusy = true;
    App.call('api_saveTxn', { id: id, edit: true, date: t.date, type: t.type, category: t.category, payMethod: t.payMethod, amount: amount, memo: t.memo })
      .then(function (r) {
        App._txBusy = false;
        App.invalidateLoads();
        App.replaceTxns(r.txns);
        if (p) p.sel = {};
        App.closeSheet();
        App.render();
        if (quiet) { App.toast('되돌렸어요'); return; }
        App.toast(k + '회차 ' + App.won(before) + ' → ' + App.won(amount), function () { self.setAmount(id, before, null, true); });
      }, function (e) {
        App._txBusy = false;
        var reason = recordErrorText(e);
        App.closeSheet();
        if (/찾을 수 없습니다/.test(reason)) { self.dropGone([id]); App.toast('이미 지워진 회차예요'); return; }
        App.render();
        App.toast('고치지 못했어요 · ' + reason);
      });
  },

  /* ---------- 취소 / 취소 풀기 ---------- */

  /** 고른 회차 중 하나라도 취소가 아니면 모두 취소, 모두 취소면 모두 취소 풀기. 되돌리기는 바뀐 회차만 이전 값으로 */
  cancel: function () {
    var p = this.cur(); if (!p || App._txBusy) return;
    var sel = this.selected(p); if (!sel.length) return;
    var want = !sel.every(function (r) { return r.txn.canceled; });
    var ids = sel.filter(function (r) { return r.txn.canceled !== want; }).map(function (r) { return r.txn.id; });
    var self = this;
    this.setCanceled(ids, want, function () {
      p.sel = {};
      App.render();
      App.toast(sel.length + '개 회차 ' + (want ? '취소했어요' : '취소를 풀었어요'), function () {
        self.setCanceled(ids, !want, function () { App.render(); App.toast('되돌렸어요'); });
      });
    });
  },
  setCanceled: function (ids, want, done) {
    if (App._txBusy) return;
    var self = this;
    App._txBusy = true;
    App.call('api_setCanceled', ids, want).then(function (r) {
      App._txBusy = false;
      App.invalidateLoads();
      App.replaceTxns(r || []);
      done();
    }, function (e) {
      App._txBusy = false;
      var reason = recordErrorText(e);
      if (/찾을 수 없습니다/.test(reason)) { self.dropGone(ids); App.toast('이미 지워진 회차가 있어요 · 다시 확인해 주세요'); return; }
      App.render();
      App.toast('바꾸지 못했어요 · ' + reason);
    });
  },

  /* ---------- 삭제 N (확인 후, 되돌리기) ---------- */

  deleteSheet: function () {
    var p = this.cur(); if (!p) return;
    var n = this.selected(p).length; if (!n) return;
    App.sheet(n + '개 회차 지우기', '<p class="meta sub plan-sheet-p">' + n + '개 회차를 지울까요? 지운 뒤에도 되돌릴 수 있어요</p>' +
      '<button class="btn danger-btn" data-act="planDeleteGo">지우기</button>');
  },
  remove: function () {
    var p = this.cur(); if (!p || App._txBusy) return;
    var ids = this.selected(p).map(function (r) { return r.txn.id; });
    if (!ids.length) { App.closeSheet(); return; }
    var self = this, n = ids.length;
    App._txBusy = true;
    App.call('api_deleteTxns', ids).then(function (r) {
      App._txBusy = false;
      App.invalidateLoads();
      var book = App.state.book;
      var pos = book.txns.map(function (x) { return x.id; });
      var at = Math.min.apply(null, ids.map(function (id) { return pos.indexOf(id); }).filter(function (i) { return i >= 0; }).concat([book.txns.length]));
      book.txns = book.txns.filter(function (x) { return ids.indexOf(x.id) < 0; });
      var hit = (r.installs || []).map(function (x) { return x.id; });
      book.installs = dropFromInstalls(book.installs || [], ids);
      applyRenumber(book, book.installs.filter(function (x) { return hit.indexOf(x.id) >= 0; })); // 남은 회차는 남은 것만으로 다시 센다 (#94)
      p.sel = {};
      App.closeSheet();
      var gone = !self.ins(p.id);
      if (gone) self.leave(p);
      else App.render();
      App.toast(n + '개 회차를 지웠어요' + (gone ? ' · 할부가 모두 지워졌어요' : ''), function () { App.txRestore(r.removed, r.installs, at); });
    }, function (e) {
      App._txBusy = false;
      App.closeSheet();
      var reason = recordErrorText(e);
      if (/찾을 수 없습니다/.test(reason)) { self.dropGone(ids); App.toast('이미 지워진 회차가 있어요 · 다시 확인해 주세요'); return; }
      App.render();
      App.toast('지우지 못했어요 · ' + reason);
    });
  },
  /** 할부가 없어지면 할부 상세를 닫는다. 그 아래 거래 상세의 거래도 지워졌으면 함께 닫는다 */
  leave: function (p) {
    var top = App.stack[App.stack.length - 1];
    if (top && top.params === p) App.stack.pop();
    top = App.stack[App.stack.length - 1];
    while (top && top.name === 'detail' && !App.txnById(top.params.id)) { App.stack.pop(); top = App.stack[App.stack.length - 1]; }
    App.render();
    window.scrollTo(0, 0);
  },
  /** 다른 기기에서 지운 회차: 서버를 다시 읽어 맞춘다 (화면은 바로 다시 그린다) */
  dropGone: function () {
    var seq = App.invalidateLoads();
    App.call('api_load').then(function (r) {
      if (seq !== App._loadSeq || !r) return;
      App.state.book = r.book;
      var p = App.screens.plan.cur();
      if (p && !App.screens.plan.ins(p.id)) App.screens.plan.leave(p);
      else App.render();
    }, function () { App.render(); });
  },
};

App.actions.instMonth = function (d) {
  App.go('history', { year: Number(d.ym.slice(0, 4)), month: Number(d.ym.slice(5, 7)), category: '' });
};
App.actions.planOpen = function (d) { App.go('plan', { id: d.id }); };
App.actions.planToggle = function (d) {
  var p = App.screens.plan.cur(); if (!p) return;
  p.sel = p.sel || {};
  if (p.sel[d.id]) delete p.sel[d.id]; else p.sel[d.id] = true;
  App.render();
};
App.actions.planAll = function () {
  var P = App.screens.plan, p = P.cur(); if (!p) return;
  var ins = P.ins(p.id); if (!ins) return;
  var rounds = installStatus(App.state.book, ins, App.state.today).rounds;
  var all = P.selected(p).length === rounds.length;
  p.sel = {};
  if (!all) rounds.forEach(function (r) { p.sel[r.txn.id] = true; });
  App.render();
};
App.actions.planAmount = function () { App.screens.plan.amountSheet(); };
App.actions.planCancel = function () { App.screens.plan.cancel(); };
App.actions.planDelete = function () { App.screens.plan.deleteSheet(); };
App.actions.planDeleteGo = function () { App.screens.plan.remove(); };
</script>

  <script>
/**
 * 나의 예산 · 예산 설정 · 카테고리 예산 (작업 14, spec §1 · §2.5 · design §2 예산, 시안 budget · budgetSet · catBudget).
 * 나의 예산(탭 budget): 머리(나의 예산 · 연필 · +) · 달 이동 ‹ 2026년 11월 › · 예산 조정 ·
 *   그 달 전체 예산·사용률·막대·사용·남음(넘으면 "초과 N원 · M% 초과") · 카테고리별 예산 줄(남음/초과 · 사용/예산 · 막대) ·
 *   한 줄 안내(이번 달만, paceMessage 문구 — 금액 없음 #53·#54). 탭에 들어올 때마다 이번 달로.
 * 예산 조정(budgetSet, { year, month }): 보고 있던 달의 카테고리별 금액 입력, 바뀐 칸 표시("300,000원에서 +50,000원"), 합계 자동,
 *   [저장 · N개 바뀜] (작업 14a, #64 — "다음 달에도" 토글 없앰).
 * 카테고리 예산(catBudget, { year, month, category }): 금액 칸(누르면 폰 숫자 키보드, App.amountField — L2 #82), 기존 금액과의 차이,
 *   변경 후 그 달 전체 예산·남은 예산, "N원으로 변경". 빈칸 = 0원 (0원으로도 바꿀 수 있다, #69).
 * 저장하면 아래 창 "바뀐 예산을 어느 달에 적용할까요?"(시안 budget-v2 B): 바뀐 항목 · [N월만(기본, #95) · N월부터 올해 끝까지 · 달 고르기] ·
 *   예산 없는 달·따로 더해 둔 달 안내(버튼 바로 위 고정) · [적용하기] → api_applyBudget(바뀐 만큼 더하기, 예산 없는 달은 고치는 달 예산 전체로 #68).
 *   지난 달은 창 없이 그 달만(api_saveBudgetMonth).
 * 계산은 Month.js monthSummary · budgetOf · paceMessage · overText, Budget.js budgetMonthsFrom · yearEndMonths · unusualMonths.
 */
App.state.bud = { year: 0, month: 0, note: '' };

var BUD_SAVED = '예산을 저장했어요. 남은 금액도 반영했어요.';
/** 서버 검증 문구 — 다시 시도해도 같으므로 이유만 보여 준다 */
var BUD_INPUT_ERRORS = [/^카테고리를 확인해 주세요/, /^예산은 0원 이상/, /^달을 확인해 주세요/, /^적용할 달을 확인해 주세요/, /^바뀐 예산이 없어요/];

/** 320000 → '320,000' (원 없이) */
function budPlain(n) { return App.won(n).replace(/원$/, ''); }
/** 그 달 지출 카테고리 (순서대로) */
function budCats() {
  return ((App.state.book && App.state.book.categories) || []).filter(function (c) { return c.type === '지출'; })
    .slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
}
/** 이번 달이면 '이번 달', 아니면 '11월' (다른 해는 '2025년 12월') */
function budMonthWord(y, m) {
  if (y === App.state.ym.year && m === App.state.ym.month) return '이번 달';
  return (y !== App.state.ym.year ? y + '년 ' : '') + m + '월';
}
/** 이번 달보다 앞선 달인가 (지난 달은 창 없이 그 달만 고친다, #64) */
function budIsPast(y, m) { return y * 12 + m < App.state.ym.year * 12 + App.state.ym.month; }
/** 'YYYY-MM' 또는 (y, m) → '11월' (올해가 아니면 '2027년 6월') */
function budYm(y, m) {
  if (typeof y === 'string') { m = Number(y.slice(5, 7)); y = Number(y.slice(0, 4)); }
  return (y !== App.state.ym.year ? y + '년 ' : '') + m + '월';
}
/** +50,000원 / −20,000원 */
function budSigned(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + App.won(n); }
/** 받침이 있으면 '은', 없으면 '는' */
function budEun(w) {
  var c = w.charCodeAt(w.length - 1) - 0xac00;
  return w + (c >= 0 && c <= 11171 && c % 28 ? '은' : '는');
}
/**
 * 예산 조정 입력칸을 보이는 곳으로 (#69). 보이는 곳 = visualViewport(키보드 뺀 영역) 중 아래 고정 저장 줄 위.
 * 저장 줄은 그대로 두고(키보드가 화면을 줄이는 폰에서는 키보드 바로 위), 칸이 그 위로 오도록 페이지를 스크롤한다.
 */
/** 커서를 숫자 끝("원" 바로 앞)에 (#69). inputmode=numeric 인 text 칸이라 setSelectionRange 가 된다 */
function budCaretEnd(t) {
  setTimeout(function () {
    if (document.activeElement !== t) return;
    var n = t.value.length;
    try { t.setSelectionRange(n, n); } catch (x) { /* 지원 안 하면 그대로 */ }
  }, 0);
}
function budReveal(input) {
  var row = input.closest ? input.closest('.field-row') || input : input;
  var vv = window.visualViewport;
  var top = vv ? vv.offsetTop : 0, bottom = top + (vv ? vv.height : window.innerHeight);
  var bar = document.querySelector('#app .bottom-btn');
  if (bar) { var bt = bar.getBoundingClientRect().top; if (bt < bottom && bt > top) bottom = bt; }
  var r = row.getBoundingClientRect(), pad = 12;
  if (r.top >= top + pad && r.bottom <= bottom - pad) return;
  var target = top + Math.max(pad, (bottom - top - r.height) / 2);
  window.scrollBy(0, r.top - target);
}
// 키보드가 열리고 닫히며 보이는 높이가 바뀔 때, 고치는 칸을 다시 보이게
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () {
    var a = document.activeElement;
    if (a && a.getAttribute && a.getAttribute('data-cat') !== null && a.closest && a.closest('.bud-fields')) budReveal(a);
  });
}
/**
 * 금액 입력칸(data-cat)을 누를 때 (#69): 커서는 숫자 끝("원" 바로 앞), 그 줄은 키보드·아래 고정 줄 위 보이는 곳으로.
 * 예산 조정과 예산 수립(Setup.html)이 같이 쓴다. el = 화면(.screen), 칸은 .bud-fields 안에 있어야 한다(키보드 resize 처리)
 */
function budFieldFocus(el) {
  el.addEventListener('focusin', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute || t.getAttribute('data-cat') === null) return;
    el.classList.add('bud-kb'); // 아래 여유: 맨 아래 줄도 키보드 위로 올릴 수 있게
    // 커서는 숫자 끝. 폰은 focus 뒤 누른 자리에 커서를 다시 두므로, 처음 누른 탭(pointerup·click)과 320ms 뒤에도 끝으로.
    // 이미 고치는 중에 다시 누르거나 입력하면(_budUntouched=false) 사용자가 둔 자리를 그대로 둔다
    t._budFresh = true; t._budUntouched = true;
    budCaretEnd(t);
    budReveal(t);
    setTimeout(function () {
      if (document.activeElement !== t) return;
      if (t._budUntouched) budCaretEnd(t);
      budReveal(t); // 키보드가 다 올라온 뒤 한 번 더
    }, 320);
  });
  function firstTap(e) {
    var t = e.target;
    if (!t || !t.getAttribute || t.getAttribute('data-cat') === null || document.activeElement !== t) return;
    if (!t._budFresh) { if (e.type === 'click') t._budUntouched = false; return; } // 두 번째 탭부터는 사용자 뜻대로
    budCaretEnd(t);
    if (e.type === 'click') t._budFresh = false;
  }
  el.addEventListener('pointerup', firstTap);
  el.addEventListener('click', firstTap);
  el.addEventListener('focusout', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (!(a && a.getAttribute && a.getAttribute('data-cat') !== null && el.contains(a))) el.classList.remove('bud-kb');
    }, 50);
  });
  // input 처리(값 다듬기·합계)는 화면마다. 입력하면 그 칸의 _budUntouched·_budFresh 를 false 로 (사용자가 둔 커서 자리를 지킨다)
}
/** 저장 실패 알림: 검증 오류는 이유, 그 밖에는 다시 시도 */
function budSaveFailed(e, retry) {
  var reason = recordErrorText(e);
  if (BUD_INPUT_ERRORS.some(function (re) { return re.test(reason); })) App.toast('저장하지 못했어요 · ' + reason);
  else App.toast('저장하지 못했어요', retry, '다시 시도');
}

App.screens.budget = {
  /** 탭에 들어올 때마다 이번 달 (params.year·month 가 있으면 그 달) */
  enter: function (params) {
    var b = App.state.bud;
    b.note = '';
    b.year = Number(params.year) || App.state.ym.year;
    b.month = Number(params.month) || App.state.ym.month;
  },
  st: function () {
    var b = App.state.bud;
    if (!b.year) { b.year = App.state.ym.year; b.month = App.state.ym.month; }
    return b;
  },
  render: function () {
    var b = this.st(), book = App.state.book;
    var sum = monthSummary(book, b.year, b.month);
    var isNow = b.year === App.state.ym.year && b.month === App.state.ym.month;
    var over = sum.left < 0;
    var h = App.head('나의 예산', { right: '<button class="icon-btn" data-act="budSet" aria-label="예산 조정">' + App.icon('pencil') + '</button>' });

    h += '<div class="row-between bud-top"><div class="pill month-nav"><button' + App.data({ act: 'budMonth', d: -1 }) + ' aria-label="이전 달">' + App.icon('left') + '</button>' +
      '<span class="num">' + b.year + '년 ' + b.month + '월</span>' +
      // › 는 예산을 세울 수 있는 마지막 달까지 (서버 api_setupBudget 범위와 같은 setupTargetEnd, #72 검토)
      (this.atEnd(b) ? '<button class="off" aria-disabled="true" aria-label="다음 달 (더 갈 수 없어요)">' + App.icon('right') + '</button></div>'
        : '<button' + App.data({ act: 'budMonth', d: 1 }) + ' aria-label="다음 달">' + App.icon('right') + '</button></div>') +
      '<button class="pill soft bud-adjust" data-act="budSet">예산 조정</button></div>';

    h += '<div class="card bud-total"><div class="meta sub">' + b.month + '월 전체 예산</div>' +
      '<div class="row-between bud-total-mid"><span class="big num">' + App.won(sum.budget) + '</span>' +
      (sum.budget > 0 ? '<span class="meta bud-rate ' + (over ? 'over' : 'green') + '">' + Math.round(sum.rate * 100) + '% 사용</span>' : '') + '</div>' +
      '<div class="bud-bar">' + App.bar(sum.spent, sum.budget) + '</div>' +
      '<div class="row-between meta bud-foot"><span class="sub">사용 ' + App.won(sum.spent) + '</span>' +
      '<span class="bud-left ' + (over ? 'over' : 'green') + '">' + (over ? overText(sum.left, sum.budget) : '남음 ' + App.won(sum.left)) + '</span></div></div>';

    if (!sum.budget) {
      h += '<div class="note beige bud-empty"><b>' + budMonthWord(b.year, b.month) + ' 예산이 아직 없어요</b>' +
        '<span>전월·작년 예산을 초안으로 가져와 고칠 수 있어요</span>' +
        '<button class="btn" data-act="budSetup">예산 세우기</button></div>';
    }

    h += '<div class="section"><h2>카테고리별 예산</h2><span class="more">' + sum.lines.length + '개 카테고리</span></div>';
    h += '<div class="list-card bud-cats">' + sum.lines.map(function (l) {
      var left = l.over ? overText(l.left, l.budget) : !l.budget && !l.spent ? '예산 없음' : App.won(l.left) + ' 남음';
      return '<button class="cat"' + App.data({ act: 'budCat', cat: l.category }) + '>' + App.catTile(l.category) +
        '<b>' + App.esc(l.category) + '</b><span class="r' + (l.over ? ' over' : !l.budget && !l.spent ? ' none' : '') + '">' + left + '</span>' +
        '<span class="s num">' + budPlain(l.spent) + ' / ' + App.won(l.budget) + '</span>' + App.bar(l.spent, l.budget, 'thin') + '</button>';
    }).join('') + '</div>';

    // 한 줄 안내: 저장한 직후에는 저장 안내, 아니면 이번 달만 속도 문구 (남은 기간에 쓸 금액은 보여 주지 않는다 #53·#54)
    var note = b.note || (isNow && sum.budget ? paceMessage(sum, App.state.today) : '');
    if (note) h += '<div class="note bud-note">' + App.esc(note) + '</div>';
    return h;
  },
  /** 달 옮기기 (지난 달·앞 달 모두) */
  /** 보고 있는 달이 예산을 세울 수 있는 마지막 달인가 */
  atEnd: function (b) {
    return b.year + '-' + (b.month < 10 ? '0' : '') + b.month >= setupTargetEnd(App.state.book, App.state.today);
  },
  move: function (d) {
    var b = this.st();
    if (d > 0 && this.atEnd(b)) return;
    var t = b.year * 12 + (b.month - 1) + d;
    b.year = Math.floor(t / 12); b.month = t % 12 + 1;
    b.note = '';
    App.render();
  },
  /** 예산 조정·카테고리 예산을 저장(적용)한 뒤: 화면을 닫고 탭(고친 달)에 안내 + 알림 msg */
  saved: function (p, cur, msg) {
    App.state.bud.year = p.year; App.state.bud.month = p.month;
    App.state.bud.note = BUD_SAVED;
    if (cur) App.close(); else App.render();
    App.toast(msg || '예산을 저장했어요');
  },
};

App.screens.budgetSet = {
  cur: function () {
    var top = App.stack[App.stack.length - 1];
    return top && top.name === 'budgetSet' ? top.params : null;
  },
  /** 처음 그릴 때: 그 달 카테고리 예산 (orig = 지금 금액, draft = 고치는 금액) */
  init: function (p) {
    if (p.draft) return;
    var book = App.state.book;
    if (!p.year) { p.year = App.state.bud.year || App.state.ym.year; p.month = App.state.bud.month || App.state.ym.month; }
    p.draft = {}; p.orig = {};
    budCats().forEach(function (c) { p.orig[c.name] = p.draft[c.name] = budgetOf(book, p.year, p.month, c.name); });
  },
  total: function (p, key) {
    return budCats().reduce(function (s, c) { return s + (p[key || 'draft'][c.name] || 0); }, 0);
  },
  /** 바뀐 것만 [{ category, from, to }] (카테고리 순서대로) */
  changes: function (p) {
    return budCats().filter(function (c) { return (p.draft[c.name] || 0) !== (p.orig[c.name] || 0); })
      .map(function (c) { return { category: c.name, from: p.orig[c.name] || 0, to: p.draft[c.name] || 0 }; });
  },
  hint: function (p, name) {
    var v = p.draft[name] || 0, o = p.orig[name] || 0;
    return v === o ? '지금 ' + App.won(o) : App.won(o) + '에서 ' + budSigned(v - o);
  },
  diffText: function (p) {
    var t = this.total(p), was = this.total(p, 'orig');
    return t === was ? '카테고리 금액을 더해 자동으로 계산해요' : '지금보다 ' + App.won(t - was) + (t > was ? ' 늘어나요' : ' 줄어들어요');
  },
  btnText: function (p) {
    var n = this.changes(p).length;
    return p.saving ? '저장하는 중…' : n ? '저장 · ' + n + '개 바뀜' : '저장';
  },
  render: function (p) {
    this.init(p);
    var self = this;
    var h = App.subhead('예산 조정');
    h += '<div class="pill bud-month"><span class="sub">고칠 달</span><span class="num">' + p.year + '년 ' + p.month + '월</span></div>';
    h += '<div class="card soft bud-sum"><div class="label">' + budYm(p.year, p.month) + ' 전체 예산</div>' +
      '<div class="big num" id="bsTotal">' + App.won(this.total(p)) + '</div>' +
      '<div class="meta green" id="bsDiff">' + this.diffText(p) + '</div></div>';
    h += '<h2 class="bud-h2">카테고리별로 고쳐요</h2>';
    h += '<div class="rows bud-fields">' + budCats().map(function (c, i) {
      var v = p.draft[c.name] || 0, ch = v !== (p.orig[c.name] || 0);
      return '<div class="field-row"><label for="bs' + i + '"><b>' + App.esc(c.name) + '</b><span id="bsh' + i + '"' + (ch ? '' : ' class="gray"') + '>' +
        self.hint(p, c.name) + '</span></label><span class="field' + (ch ? ' changed' : '') + '" id="bsf' + i + '">' +
        '<input id="bs' + i + '" class="num" inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="0"' + App.data({ cat: c.name, i: i }) +
        ' value="' + (v ? budPlain(v) : '') + '"><span class="sub">원</span></span></div>';
    }).join('') + '</div>';
    h += '<p class="meta sub bud-after">' + (budIsPast(p.year, p.month) ? '지난 달은 이 달 예산만 고쳐요' : '저장하면 바뀐 금액을 어느 달에 적용할지 골라요') + '</p>';
    var off = p.saving || !this.changes(p).length;
    h += '<div class="bottom-btn"><button class="btn num" data-act="budSave"' + (off ? ' disabled' : '') + '>' + this.btnText(p) + '</button></div>';
    return h;
  },
  /** 입력할 때마다 숫자만 남겨 쉼표를 넣고, 그 줄 표시·합계·저장 버튼을 다시 쓴다.
   *  칸을 누르면(#69) 커서는 숫자 끝("원" 바로 앞), 그 줄은 키보드·아래 저장 줄 위 보이는 곳으로 올린다 */
  mount: function (el) {
    var self = this;
    budFieldFocus(el);
    el.addEventListener('input', function (e) {
      var t = e.target, p = self.cur();
      if (!p || !t || !t.getAttribute || t.getAttribute('data-cat') === null) return;
      t._budUntouched = false; t._budFresh = false;
      var name = t.getAttribute('data-cat'), i = t.getAttribute('data-i');
      var digits = amountDigits(t.value, RECORD_MAX_DIGITS, p.draft[name] ? String(p.draft[name]) : '');
      p.draft[name] = Number(digits || 0);
      t.value = digits ? budPlain(Number(digits)) : '';
      var ch = p.draft[name] !== (p.orig[name] || 0);
      var hint = document.getElementById('bsh' + i), field = document.getElementById('bsf' + i);
      if (hint) { hint.textContent = self.hint(p, name); hint.className = ch ? '' : 'gray'; }
      if (field) field.className = 'field' + (ch ? ' changed' : '');
      var tot = document.getElementById('bsTotal'), diff = document.getElementById('bsDiff');
      if (tot) tot.textContent = App.won(self.total(p));
      if (diff) diff.textContent = self.diffText(p);
      var btn = el.querySelector('[data-act=budSave]');
      if (btn) { btn.textContent = self.btnText(p); btn.disabled = !!p.saving || !self.changes(p).length; }
    });
  },
  /** 지난 달: 그 달만 저장. 이번 달 이후: 적용할 달 창 */
  save: function () {
    var p = this.cur(); if (!p || p.saving) return;
    var changes = this.changes(p);
    if (!changes.length) return;
    if (!budIsPast(p.year, p.month)) { BudApply.open(p, changes); return; }
    var self = this, amounts = {};
    changes.forEach(function (c) { amounts[c.category] = c.to; });
    p.saving = true;
    App.render();
    App.call('api_saveBudgetMonth', p.year, p.month, amounts).then(function (budgets) {
      p.saving = false;
      App.invalidateLoads();
      App.state.book.budgets = budgets;
      App.screens.budget.saved(p, self.cur() === p, budYm(p.year, p.month) + ' 예산을 고쳤어요');
    }, function (e) {
      p.saving = false;
      if (self.cur() === p) App.render();
      budSaveFailed(e, function () { if (self.cur() === p) self.save(); });
    });
  },
};

App.screens.catBudget = {
  cur: function () {
    var top = App.stack[App.stack.length - 1];
    return top && top.name === 'catBudget' ? top.params : null;
  },

    }
    if (p.orig === undefined) { p.orig = budgetOf(book, p.year, p.month, p.category); p.v = p.orig ? String(p.orig) : ''; }
    var c = this.calc(p);

    var h = '<div class="cb-top">' + App.subhead(p.category + ' 예산');
    h += '<div class="meta sub">' + p.year + '년 ' + p.month + '월 · 카테고리 예산</div>';
    h += '<div class="ask dark cb-ask">' + App.esc(p.category) + '에 얼마를 배정할까요?</div>';
    h += App.amountField(p.v, '예산');
    h += '<div class="meta green cb-diff">' + this.diffText(p, c) + '</div><div class="divider"></div></div>';

    h += '<div class="cb-mid"><div class="card soft cb-card">' + this.cardHtml(p, c) + '</div>' +
      '<p class="meta sub cb-kept">이미 기록한 지출 ' + App.won(c.sum.spent) + '은 그대로 유지돼요</p></div>';

    // 아래는 버튼 하나 (앱 키패드는 없앴다 — 금액은 위 금액 칸에서 폰 숫자 키보드). 알림은 버튼 위
    h += '<div class="cb-bottom"><button class="btn cb-save" data-act="cbSave" data-toast-anchor' + (this.off(p, c) ? ' disabled' : '') + '>' +
      this.btnText(p, c) + '</button></div>';

  },
  /** 지금 고친 금액으로: n(새 금액) · d(기존과의 차이) · 변경 후 그 달 전체 예산 total · 남은 예산 left · 그 달 요약 sum */

  mode: function (mode) {
