  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">

  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('moa_prefs') || '{}'), el = document.documentElement;
        if (p && p.tone && !el.dataset.tone) el.dataset.tone = p.tone;
        if (p && p.mode && !el.dataset.mode) el.dataset.mode = p.mode;
      } catch (e) { /* 저장소를 못 읽으면 기본값 */ }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="moa-tone" content="">
  <meta name="moa-first" content="">
  <meta name="moa-mode" content="">
  <script>
    // 밝게/어둡게 정하기 (L4a): html[data-mode] = auto(없으면)|light|dark → html[data-scheme] = light|dark.
    // 첫 그림 전에 동기로 실행한다. 설정에서 data-mode 를 바꾸면 window.applyScheme() 를 부른다
    // 이 계정에 저장된 톤·모드는 서버가 넣는다 (HtmlService 는 <html> 속성을 지우므로 meta 로 받아 여기서 붙인다).
    // 미리보기 주소 파라미터(mock.js)가 먼저 정한 값은 덮지 않는다
    (function () {
      var el = document.documentElement;
      function meta(n) { var m = document.querySelector('meta[name="moa-' + n + '"]'); return m ? m.content : ''; }
      if (!el.dataset.tone && meta('tone')) el.dataset.tone = meta('tone');
      if (!el.dataset.mode && meta('mode')) el.dataset.mode = meta('mode');
      // 첫 접속(F3): 구매자 가계부가 아직 없거나 가족이 아직 연결 전이면 '1' → 화면이 꾸미는 로딩을 고른다 (Client.html App._firstRun)
      if (!el.dataset.first && meta('first')) el.dataset.first = meta('first');
    })();
    (function () {
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      function applyScheme() {
        var el = document.documentElement, m = el.dataset.mode;
        el.dataset.scheme = (m === 'dark' || (m !== 'light' && mq && mq.matches)) ? 'dark' : 'light';
      }
      window.applyScheme = applyScheme;
      applyScheme();
      if (mq) { if (mq.addEventListener) mq.addEventListener('change', applyScheme); else if (mq.addListener) mq.addListener(applyScheme); }
    })();
  </script>
  <!-- 디자인 토큰과 공통 부품 (design.md §3). 출처: prototype/figma-app.html 의 :root 와 부품 CSS — 값은 여기서만 정한다 -->

<style>
  /* ===== 토큰 ===== */
  :root {
    color-scheme: light;
    --bg: #f6f4ef;          /* 화면 바탕 */
    --card: #ffffff;        /* 카드 */

    --ink: #20352a;         /* 본문 */
    --sub: #7c8781;         /* 보조 */
    --green: #4a6e56;       /* 녹색 글자 (남음·안내) */
    --primary: #3d6a4f;     /* 주요 버튼·막대 */
    --track: #e7eae3;       /* 막대 바탕 */
    --line: #ebe9e4;        /* 구분선 */
    --over: #b5553a;        /* 초과 */
    --on-primary: #fff;     /* 주요 색(버튼·선택 칩·토스트) 위 글자 */
    --knob: #fff;           /* 스위치 손잡이 */
    --check-ring: #fff;     /* 선택된 체크·라디오 안쪽 고리 */
    --page-edge: #dcdad4;   /* 폰 폭 밖 바깥 바탕 (html) */
    --bg-clear: rgba(246,244,239,0); /* 바탕색의 투명 (아래 고정 버튼 그라데이션 끝) */
    --scrim: rgba(32,53,42,.3);      /* 시트 뒤 어두운 막 */
    --bar-on-soft: #ccd9c3; /* 연녹색 카드 안 막대 바탕 */
    --over-soft: #fbefe9;   /* 초과·취소 안내 바탕 (연한 붉은빛) */
    --toast-action: #b9d7c2; /* 토스트 안 동작 글자 */
    --mark: #f3e2a9;        /* 검색어 강조 */
    --seg-bg: #e8ece4;      /* 두 칸 선택 바탕 */
    --placeholder: #c8ccc7; /* 비어 있는 금액 글자 */
    --soft-press: #d3e0c8;  /* 연한 버튼 눌림 */
    --primary-press: #2f553e; /* 주요 버튼 눌림 */
    --tile-neutral: #eef1ec; /* 결제 수단 아이콘 칸 */
    --toggle-off: #cfd4cc;  /* 꺼진 스위치 바탕 */
    --pill-glass: rgba(255,255,255,.7); /* 남은 금액 알약 (반투명 흰색) */
    --grab: #d6d9d2;        /* 시트 손잡이 */
    --radio-line: #b9c2bb;  /* 선택 안 된 라디오 테두리 */
    --accent-dot: #c99a4b;  /* 특별한 달 점 */
    --week-bar: #b9cbb0;    /* 주간 막대 */
    --cal-expense: #9e3b30; /* 리포트 달력 지출 글자·범례 (L3 C 진한 톤, #97) */
    --cal-income: #2f5585;  /* 리포트 달력 수입 글자·범례·고른 날 줄 수입 (#97) */
    --cat-1: #e8eee3; --cat-2: #ece8f1; --cat-3: #f6e9de; --cat-4: #e4ebf3;
    --cat-5: #ecebe7; --cat-6: #f5e6e8; --cat-7: #e6f0ee; --cat-8: #f3eee6; /* 카테고리 칸 색 1~8 (초록·보라·살구·하늘·회색·분홍·민트·베이지) */
    --cat-1-strong: #557a5f; --cat-2-strong: #a9c09a; --cat-3-strong: #e7b994; --cat-4-strong: #b5bad3;
    --cat-5-strong: #d9d8d0; --cat-6-strong: #d9a3ab; --cat-7-strong: #8fb8ad; --cat-8-strong: #c9b79c; /* 카테고리 진한 색 1~8 */
    --toast-bg: #20352a;    /* 토스트 바탕 (밝게=본문색, 다크=카드보다 밝은 면) */
    --seg-on: #ffffff;      /* 두 칸 선택에서 고른 칸 */
    --report-1: #557a5f; --report-2: #a9c09a; --report-3: #e7b994; --report-4: #b5bad3; --report-5: #d9d8d0; /* 리포트 도넛 색 */
    --r-card: 22px; --r-btn: 16px; --r-pill: 99px;
    --font: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }

html[data-tone="lavender"]:root {

  --cat-1: #34443c; --cat-2: #3d3948; --cat-3: #4c3f33; --cat-4: #31404f; --cat-5: #3e3e3b; --cat-6: #4a3842; --cat-7: #314541; --cat-8: #453e33;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--page-edge); }
  body { margin: 0 auto; max-width: 430px; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; }
  button { font: inherit; color: inherit; border: none; background: none; padding: 0; cursor: pointer; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num { font-variant-numeric: tabular-nums; }
  .sub { color: var(--sub); }
  .green { color: var(--green); }
  .over { color: var(--over); }

  /* ===== 골격 ===== */
  .screen { padding: 8px 24px 120px; }
  .screen.with-btn { padding-bottom: 96px; }
  .head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-bottom: 16px; }
  .head h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
  .head-r { display: flex; align-items: center; gap: 2px; }
  .head-r .icon-btn { margin-right: 0 !important; }
  .head-r .add-btn { margin-left: 6px; }
  .add-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }
  .head .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px; }
  /* 하위 화면 머리는 스크롤해도 위에 붙어 있다 (#57). 바탕을 화면 폭 끝까지 */
  .subhead { display: flex; align-items: center; gap: 4px; min-height: 48px; margin: 0 -24px 12px; padding: 0 24px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .subhead h1 { font-size: 24px; font-weight: 700; margin: 0 0 0 4px; flex: 1; letter-spacing: -0.5px; }
  .subhead .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .subhead .icon-btn:first-child { margin-left: -12px; }
  .subhead .icon-btn:last-child { margin-right: -12px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px; border-radius: var(--r-pill); background: var(--card); font-size: 14px; font-weight: 500; }
  .pill.wide { min-width: 84px; }
  .pill.soft { background: var(--soft); color: var(--green); }
  .pill svg.i { width: 16px; height: 16px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }

  .card { background: var(--card); border-radius: var(--r-card); padding: 20px; }
  .card.soft { background: var(--soft); }
  .card + .card, .rows + .card, .card + .section, .section + .card { margin-top: 12px; }
  .label { font-size: 14px; color: var(--green); font-weight: 500; }
  .label.gray { color: var(--sub); font-weight: 400; }
  .hero { font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1.2; }
  .hero small { font-size: 18px; font-weight: 500; margin-left: 6px; letter-spacing: 0; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 1.25; }
  .mid { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .meta { font-size: 13px; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .card.soft .bar { background: var(--bar-on-soft); }
  .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
  .bar.thin { height: 4px; }
  .bar.over > i { background: var(--over); }
  .inner { background: var(--soft-2); border-radius: 18px; padding: 16px; }

  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 0 12px; }
  .section h2 { font-size: 19px; font-weight: 700; margin: 0; }
  .section .more { font-size: 13px; color: var(--sub); min-height: 32px; display: inline-flex; align-items: center; }

  /* 거래 줄 */
  .tile { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: var(--ink); flex: none; }
  .tile svg.i { width: 20px; height: 20px; }
  .tx { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 56px; }
  .tx .t { flex: 1; min-width: 0; }
  .tx .t b { display: block; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .t span { font-size: 12px; color: var(--sub); }
  .tx .a { font-size: 15px; font-weight: 500; }
  .list-card { background: var(--card); border-radius: var(--r-card); padding: 6px 18px; }
  .list-card .tx { padding: 6px 0; }
  .tx-card { background: var(--card); border-radius: 20px; padding: 4px 18px; }
  .tx-card + .tx-card { margin-top: 8px; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin: 22px 4px 10px; }

  /* 칩 */
  .chips { display: flex; gap: 8px; align-items: center; margin: 16px 0 0; }
  .chip { flex: none; white-space: nowrap; height: 34px; padding: 0 15px; border-radius: var(--r-pill); background: var(--card); font-size: 14px; font-weight: 500; }
  .chip.shrink { flex: 0 1 auto; min-width: 0; }
  .chip.on { background: var(--primary); color: var(--on-primary); }
  .chips .spacer { flex: 1; }

  /* 카테고리 예산 줄 */
  .cat { display: grid; grid-template-columns: 40px 1fr auto; column-gap: 14px; align-items: start; width: 100%; text-align: left; padding: 10px 0; }
  .cat .tile { grid-row: span 2; width: 34px; height: 34px; border-radius: 11px; margin-top: 2px; }
  .cat .tile svg.i { width: 18px; height: 18px; }
  .cat b { font-weight: 500; font-size: 15px; }
  .cat .r { font-size: 13px; font-weight: 500; color: var(--green); text-align: right; }
  .cat .r.over { color: var(--over); }
  .cat .s { font-size: 11px; color: var(--sub); grid-column: 2; }
  .cat .bar { grid-column: 2 / span 2; margin-top: 8px; }
  .tx-card.open { box-shadow: inset 0 0 0 1.5px var(--soft); }
  .tx-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 0 12px; }
  .tx-acts button { height: 44px; border-radius: 12px; background: var(--bg); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tx-acts button svg.i { width: 16px; height: 16px; }
  .tx-acts button.danger { color: var(--over); }
  .tx.canceled .a { text-decoration: line-through; color: var(--sub); }
  .tx.canceled .tile { opacity: .45; }
  .tx.canceled .t b { color: var(--sub); }
  .tag-cancel { font-size: 11px; font-weight: 700; color: var(--over); background: var(--over-soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .receipt.canceled .big { text-decoration: line-through; color: var(--sub); }
  .toast-btn { margin-left: 12px; color: var(--toast-action); font-weight: 700; padding: 6px 0; }
  .inst-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .inst-grid button { height: 44px; border-radius: 12px; background: var(--card); font-size: 14px; }
  .inst-grid button.on { background: var(--primary); color: var(--on-primary); font-weight: 700; }
  .inst-grid button:disabled { opacity: .35; }
  .inst-month { display: grid; grid-template-columns: 96px 1fr 92px; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
  .inst-month b { text-align: right; font-weight: 500; }
  .inst-month span:first-child { white-space: nowrap; }
  .part { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 56px; padding: 6px 0; }
  .part + .part { border-top: 1px solid var(--line); }
  .part .t { flex: 1; } .part .t b { display: block; font-weight: 500; } .part .t span { font-size: 12px; color: var(--sub); }
  .part .a { font-weight: 500; }
  .part.canceled .a { text-decoration: line-through; color: var(--sub); }
  .part .box { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--primary); border-radius: 6px; flex: none; }
  .part .box.on { background: var(--primary); box-shadow: inset 0 0 0 3px var(--check-ring); }
  .sel-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sel-bar button { height: 52px; border-radius: 14px; background: var(--card); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 0 0 1px var(--line); }
  .sel-bar button svg.i { width: 16px; height: 16px; }
  .sel-bar button.danger { color: var(--over); }
  .sel-bar button:disabled { opacity: .4; }
  .search-box { display: flex; align-items: center; gap: 8px; height: 52px; border-radius: 16px; background: var(--card); padding: 0 6px 0 16px; color: var(--sub); }
  .search-in { flex: 1; border: none; outline: none; background: none; font: inherit; font-size: 16px; color: var(--ink); min-width: 0; }
  .chip.soft-on { background: var(--soft); color: var(--green); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .note { border-radius: 18px; padding: 16px 20px; font-size: 13px; background: var(--soft); color: var(--green); margin-top: 16px; text-align: center; }
  .note.beige { background: var(--note); color: var(--ink); text-align: left; }
  a.note-link { display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; }
  a.note-link .nl-t { flex: 1; min-width: 0; color: var(--ink); }
  a.note-link .nl-t span { display: block; color: var(--sub); }
  a.note-link .nl-go { display: flex; align-items: center; gap: 4px; flex: none; font-size: 13px; font-weight: 500; color: var(--green); }
  a.note-link .nl-go svg.i { width: 16px; height: 16px; }
  .note b { display: block; font-size: 15px; margin-bottom: 4px; }
  .note span { color: var(--sub); }

  /* 정보 줄 (라벨 · 값 ›) */
  .rows { background: var(--card); border-radius: var(--r-card); padding: 0 20px; }
  .rows .r { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 52px; text-align: left; }
  .rows .r + .r { border-top: 1px solid var(--line); }
  .rows .r .k { font-size: 13px; color: var(--sub); }
  .rows .r .k.main { font-size: 15px; color: var(--ink); }
  .handle-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 12px; }
  .handle-btn:disabled { opacity: .25; }
  .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .icon-grid button { height: 48px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .icon-grid button.on { background: var(--soft); box-shadow: inset 0 0 0 2px var(--primary); }
  .tint-row { display: grid; grid-template-columns: repeat(4, 44px); justify-content: space-between; row-gap: 10px; }
  .tint-row button { width: 44px; height: 44px; border-radius: 50%; }
  .tint-row button.on { box-shadow: inset 0 0 0 3px var(--primary); }
  svg.i.big-ic { width: 30px; height: 30px; }
  .danger-row { color: var(--over); font-size: 15px; font-weight: 500; }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-grid button { height: 44px; border-radius: 12px; background: var(--card); font-size: 15px; }
  .day-grid button.on { background: var(--primary); color: var(--on-primary); font-weight: 700; }
  .day-grid button.wide { grid-column: span 3; }
  .text-actions { display: flex; gap: 8px; margin-top: 2px; }
  .text-actions button { height: 44px; padding: 0 12px; font-size: 14px; color: var(--sub); }
  .text-actions button.danger { color: var(--over); }
  .tag-off { font-size: 11px; color: var(--sub); background: var(--track); border-radius: 6px; padding: 1px 6px; margin-left: 6px; font-weight: 500; vertical-align: 2px; }
  .group-label { font-size: 13px; color: var(--sub); margin: 24px 4px 8px; }
  .rows .r .v { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
  .rows .r .v.empty { color: var(--sub); font-weight: 400; }
  .rows .r .v svg.i { width: 16px; height: 16px; color: var(--sub); }

  /* 세그먼트 */
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--seg-bg); border-radius: 16px; padding: 4px; margin-bottom: 20px; }
  .seg button { height: 34px; border-radius: 12px; font-size: 14px; color: var(--sub); }
  .seg button.on { background: var(--seg-on); color: var(--green); font-weight: 700; }

  /* 금액 입력 */
  .ask { font-size: 13px; color: var(--sub); }
  .ask.dark { font-size: 17px; color: var(--ink); font-weight: 500; margin-top: 4px; }
  .amount { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; }
  .amount .v { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .amount .v.empty { color: var(--placeholder); }
  .amount .unit { font-size: 18px; color: var(--sub); align-self: flex-end; margin-bottom: 8px; }
  /* 금액 칸 (L2 확정 #82·#84·#86 — 앱 키패드 대신 폰 숫자 키보드, Client.html App.amountField). 기록·내역 수정·자동 기록·카테고리 예산이 같이 쓴다.
   * .amount · .v(글자 크기·굵기, 작은 화면 32px) · .unit 은 위 규칙 그대로. 칸 너비는 숨긴 글자(amt-mirror)가 정해 "원"이 숫자 바로 뒤 */
  .amt { cursor: text; }
  .amt-field { display: inline-grid; min-width: 0; max-width: calc(100% - 28px); }
  .amt-field > * { grid-area: 1 / 1; font: inherit; letter-spacing: inherit; line-height: inherit; color: inherit; }
  .amt-mirror { visibility: hidden; white-space: pre; padding-right: 3px; overflow: hidden; }
  .amt-in { width: 0; min-width: 100%; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; caret-color: var(--primary);
    outline: none; -webkit-appearance: none; appearance: none; }
  .amt-in::placeholder { color: inherit; opacity: 1; } /* 빈칸 '0' 은 흐린 0(.v.empty) 색 */
  .divider { height: 1px; background: var(--line); margin: 12px 0 16px; }
  .recent { display: flex; gap: 8px; overflow-x: auto; margin: 10px -24px 12px; padding: 0 24px; scrollbar-width: none; }
  .recent::-webkit-scrollbar { display: none; }
  .rchip { flex: none; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--card); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .rchip b { font-weight: 500; }
  .rchip span { color: var(--sub); }
  /* 기록 화면 세로 배치 (피드백 #56): 화면 높이에 맞춘 세 칸. 아래 버튼은 겹치지 않고 늘 보인다 (폰 키보드가 떠서 덮는 것은 괜찮다, #84) */
  .screen.rec-screen { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-bottom: 0; overflow: hidden; }
  .rec-top { flex: none; }
  /* 가운데는 내용만큼(줄어들 수만 있다), 아래 칸이 남는 높이를 받아 버튼을 맨 아래로 */
  .rec-mid { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -24px; padding: 0 24px; }
  /* 기록·자동 기록 수정의 4줄: 값이 길어도(결제 수단 "카드 - …" 25자, #88) 한 줄 — 넘치면 말줄임 (줄 높이가 바뀌면 화면 크기 구간의 배치가 깨진다) */
  .rec-mid .rows .r { gap: 12px; }
  .rec-mid .rows .r .k { flex: none; }
  .rec-mid .rows .r .v { min-width: 0; }
  .rec-mid .rows .r .vt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec-bottom { flex: 1 0 auto; display: flex; flex-direction: column; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  /* 버튼 줄은 아래 칸의 바닥에 붙는다 (엄지가 닿는 곳) */
  .rec-pad { margin-top: auto; padding-top: 4px; }
  /* 버튼 (#59): 어느 화면 크기든 아래 한 줄 [추가 기록] [기록 완료(넓게, 주요 색)] */
  .rec-btns { display: grid; grid-template-columns: 1fr 1.7fr; gap: 8px; padding-top: 8px; }
  .rec-btns button { height: 52px; border-radius: var(--r-btn); font-size: 16px; font-weight: 700; }
  .rec-btns .rb-more { background: var(--soft); color: var(--green); }
  .rec-btns .rb-done { background: var(--primary); color: var(--on-primary); }
  .rec-btns button:disabled { opacity: .4; }
  .rec-btns .rb-more:active:not(:disabled) { background: var(--soft-press); }
  .rec-btns .rb-done:active:not(:disabled) { background: var(--primary-press); }
  /* 세그먼트는 보이는 높이 34px, 누르는 칸 44px */
  .rec-screen .seg button { position: relative; }
  .rec-screen .seg button::after { content: ''; position: absolute; left: 0; right: 0; top: -5px; bottom: -5px; }
  /* ===== 화면 크기 구간 (피드백 #58·#60, design §4) — 보이는 높이로 나눈다. 어느 구간이든 스크롤 없이 모두 보이고 누르는 칸 44px 이상 =====
   * 큰 화면  ≥ 730px : 기본 + 금액 위 질문 줄 (730–799px 는 간격을 조금 줄인다)
   * 보통     660–729px : 질문 줄 없음, 간격을 줄이고 버튼 높이 48px
   * 작은 화면 ≤ 659px : 간격·글자(금액 32px)를 더 줄인다. 버튼은 같은 아래 한 줄
   * 경계는 앱 키패드가 있던 때 측정으로 정했다 (작업 11d). 키패드를 없앤 뒤(L2)에는 여유가 더 있다.
   * 그보다 낮은 화면은 가운데(카드)가 스크롤된다(안전망) */
  .rec-ask { margin-top: 2px; }
  @media (min-height: 730px) and (max-height: 799.98px) {
    .rec-screen .subhead { margin-bottom: 8px; }
    .rec-screen .seg { margin-bottom: 14px; }
    .rec-screen .rows .r { min-height: 50px; }
    .rec-bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (max-height: 729.98px) {
    .rec-ask { display: none; }
    .rec-screen .subhead { margin-bottom: 4px; }
    .rec-screen .seg { margin-bottom: 10px; }
    .rec-screen .amount { margin: 0; }
    .rec-screen .rows .r { min-height: 48px; }
    .rec-bottom { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    .rec-pad { padding-top: 0; }
    .rec-btns { padding-top: 6px; }
    .rec-btns button { height: 48px; }
  }
  @media (max-height: 659.98px) {
    .screen.rec-screen { padding-top: 4px; }
    .rec-screen .subhead { min-height: 44px; margin-bottom: 0; }
    .rec-screen .seg { padding: 3px; margin: 2px 0 4px; }
    .rec-screen .amount .v { font-size: 32px; line-height: 36px; }
    /* 금액 줄 높이 36px: 입력칸은 제 줄 높이로 글자를 자르므로 줄 높이를 52px 로 하고 위아래 −8px 로 상쇄 — 자리는 같고 쉼표 꼬리가 잘리지 않는다 */
    .rec-screen .amt-in { line-height: 52px; margin: -8px 0; }
    .rec-screen .amount .unit { font-size: 16px; margin-bottom: 4px; }
    .rec-screen .recent { padding-top: 6px; padding-bottom: 6px; margin-top: 0; margin-bottom: 0; }
    .rec-screen .rchip { height: 32px; }
    .rec-screen .rchip::after { top: -6px; bottom: -6px; } /* 누르는 칸 44px */
    .rec-screen .divider { margin: 6px 0 8px; }
    .rec-screen .rows .r { min-height: 44px; }
    .rec-bottom { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  }
  /* 가로로 열면(범위 밖) 세로 배치를 가운데에 둔다 — body 의 max-width 430px 가 이미 가운데 정렬 */
  /* 고르기 시트 (작업 11) */
  .sheet .pick-l { display: flex; align-items: center; gap: 12px; font-size: 15px; min-width: 0; overflow-wrap: anywhere; } /* 긴 이름은 줄 안에서 두 줄로 (#88) */
  .sheet .rows .r { min-height: 56px; }
  .pay-tile { background: var(--tile-neutral); }
  .sheet .chips { margin: 0 0 12px; }
  .sheet .chip { height: 44px; padding: 0 20px; }
  .sheet .seg { margin-bottom: 0; }
  .sheet .seg button { height: 44px; }
  .recent { padding-top: 4px; padding-bottom: 4px; margin-top: 6px; margin-bottom: 8px; } /* 칩의 누르는 칸이 잘리지 않게 (보이는 간격은 같다) */
  .rchip { position: relative; }
  .rchip::after { content: ''; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; } /* 누르는 칸 44px */
  .sheet .group-label { margin-top: 16px; }
  .sheet .group-label:first-of-type { margin-top: 4px; }
  .sheet .seg.pay-kinds { grid-template-columns: repeat(4, 1fr); }
  .pay-none { margin: 0 4px 12px; font-size: 13px; }
  /* 결제 수단 이름 칸 (#88): 앞에 고른 종류("카드 - ")가 고정 글자, 뒤쪽 이름만 친다. 칸 모양은 .text-input 과 같다 */
  .pre-input { display: flex; align-items: center; width: 100%; height: 52px; border-radius: 16px; background: var(--card); padding-left: 18px; margin-bottom: 12px; cursor: text; }
  .pre-input .pre.off { display: none; }
  .pre-input .pre { flex: none; font-size: 16px; color: var(--sub); white-space: pre; }
  .pre-input input { flex: 1; min-width: 0; height: 100%; border: none; background: none; padding: 0 18px 0 0; margin: 0; font: inherit; font-size: 16px; color: var(--ink); outline: none; }
  .sheet input.text[type="date"] { -webkit-appearance: none; appearance: none; display: block; }
  .hint { font-size: 12px; color: var(--green); margin: 6px 4px 0; min-height: 17px; }

  /* 예산 입력칸 */
  .field-row { display: flex; justify-content: space-between; align-items: center; min-height: 55px; }
  .field-row + .field-row { border-top: 1px solid var(--line); }
  .field-row label { font-size: 15px; font-weight: 500; }
  .field { display: flex; align-items: center; gap: 4px; width: 154px; height: 38px; border-radius: 12px; background: var(--bg); padding: 0 14px; }
  .field input { width: 100%; border: none; background: none; font: inherit; font-size: 16px; text-align: right; color: var(--ink); outline: none; }

  .toggle-card { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: var(--r-card); padding: 18px 20px; margin-top: 16px; }
  .toggle-card b { display: block; font-weight: 500; font-size: 15px; }
  .toggle-card span { font-size: 12px; color: var(--sub); }
  .toggle { width: 46px; height: 28px; border-radius: 14px; background: var(--toggle-off); position: relative; flex: none; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); transition: left .15s; }
  .toggle.on { background: var(--primary); }
  .toggle.on::after { left: 21px; }

  /* 상세 */
  .receipt { background: var(--card); border-radius: var(--r-card); padding: 28px 20px; text-align: center; }
  .tag { display: inline-block; padding: 4px 16px; border-radius: var(--r-pill); background: var(--soft); color: var(--green); font-size: 13px; font-weight: 500; }
  .receipt .big { margin: 12px 0 4px; }
  .receipt p { margin: 0; color: var(--sub); font-size: 15px; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .kv .k { font-size: 13px; color: var(--sub); }
  .kv .v { font-size: 20px; font-weight: 700; }

  /* 아래 고정 */
  .bottom-btn { position: fixed; left: 0; right: 0; bottom: 0; max-width: 430px; margin: 0 auto; padding: 8px 24px 16px; background: linear-gradient(to top, var(--bg) 75%, var(--bg-clear)); }
  .btn { width: 100%; height: 56px; border-radius: var(--r-btn); background: var(--primary); color: var(--on-primary); font-size: 16px; font-weight: 700; }
  .btn:disabled { opacity: .45; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; max-width: 430px; margin: 0 auto; background: var(--card); display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px 20px; border-radius: 0; }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--sub); }
  .tabbar .ic { width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .tabbar button.on { color: var(--ink); font-weight: 700; }
  .tabbar button.on .ic { background: var(--soft); }

  /* 시트·토스트 */
  .sheet-bg { position: fixed; inset: 0; background: var(--scrim); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 430px; margin: 0 auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 20px 24px 24px; display: none; z-index: 11; max-height: 80vh; overflow: auto; }
  .sheet.open, .sheet-bg.open { display: block; }
  .sheet h3 { font-size: 18px; margin: 4px 0 14px; }
  .sheet .rows .r .v svg.i { color: var(--primary); width: 18px; height: 18px; }
  .text-input, .sheet input.text { width: 100%; height: 52px; border-radius: 16px; border: none; background: var(--card); padding: 0 18px; font: inherit; font-size: 16px; color: var(--ink); outline: none; margin-bottom: 12px; }

// 시트 맨 끝에 붙인다 (실기 확인 2026-11-26, 1032행). 그래서 loadBook 이 빈 줄의 G 체크박스를 정리하고, 새 기록은 값과 G 체크박스를 한 번에 넣는다.
// TODO(관문 3): 새 가계부 만들기(SheetSetup)가 G열 체크박스를 시트 끝까지 거는 것도 기록 줄에만 걸도록 바꾼다 — 이 작업(6b) 밖.
// 순수 해석 함수(parseCategoryRow 등)와 TABS 는 브라우저에서 이미 전역이다 (src/ui/Pure.html).
var BookStore = {
  // Store.js 에서 옮긴 도우미 (Store.js 는 브라우저 묶음에 없다). 전역과 겹치지 않게 BookStore 안에 둔다
  q: function (tab, a1) { return "'" + tab + "'!" + a1; },
  vals: function (res, i) { return (res.valueRanges[i] && res.valueRanges[i].values) || []; },
  // 빈 줄: 모든 칸이 비었거나 체크 안 한 체크박스(false)뿐
  blankRow: function (row) { return !(row || []).some(function (v) { return v !== '' && v != null && v !== false; }); },
  uniqueId: function (seen) {
    var id = newId();
    while (seen[id]) id = newId();
    return id;
  },

  /**
   * 시트 전체를 읽어 { book, problems }. 사람이 넣은 줄의 번호·확인 칸을 바로잡는다 (바꿀 것이 있을 때만 한 번에 쓴다).
   * opts.fixPayNames, opts.isOwner: 자리만 남겨 둔다. 관문 1에서는 결제 수단 이름 바로잡기(#88)를 하지 않는다 —
   * 이름을 바꾸려면 보는 탭(결제 수단 줄이 이름으로 합계를 낸다)을 다시 써야 하는데, 보고용 탭은 관문 2에서 수식이 되기 때문이다.
   * 그래서 시트에 적힌 이름을 그대로 읽는다.
   */
  loadBook: async function (rest, bookId, opts) {
    var T = TABS;
    var q = BookStore.q, vals = BookStore.vals, blankRow = BookStore.blankRow, uniqueId = BookStore.uniqueId;
    var ranges = [q(T.txns, 'A2:K'), q(T.budgets, 'A2:N'), q(T.settings, 'A2:E'), q(T.settings, 'G2:I'),
      q(T.settings, 'K2:Z'), q(T.info, 'A1:B'), q(T.info, 'D2:G'), q(T.info, 'I2:L'), q(T.settings, 'V1')];
    var query = ranges.map(function (r) { return 'ranges=' + encodeURIComponent(r); }).join('&') +
      '&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER';
    var res = await rest.json('GET', Rest.SHEETS + encodeURIComponent(bookId) + '/values:batchGet?' + query);
    var problems = [];
    var fixes = [];
    function problem(tab, line, reason) { problems.push({ tab: tab, line: line, reason: reason }); }
    function fix(tab, a1, value) { fixes.push({ range: q(tab, a1), values: [[value]] }); }
    var kv = {};
    vals(res, 5).forEach(function (row, i) { if (i > 0 && row[0] != null && row[0] !== '') kv[row[0]] = cell_(row, 1); });
    var info = {
      version: kv['버전'] === undefined ? '' : kv['버전'],
      name: str_(kv['가계부 이름']), owner: str_(kv['소유자']),
      createdOn: typeof kv['만든 날'] === 'number' ? fromSerial(kv['만든 날']) : '',
      viewCats: str_(kv['보는 탭 카테고리']),
      // 결제 수단 기준 줄이 없는 예전 가계부는 null
      viewPays: Object.prototype.hasOwnProperty.call(kv, '보는 탭 결제 수단') ? str_(kv['보는 탭 결제 수단']) : null,
    };

    var categories = [];
    vals(res, 2).forEach(function (row, i) {
      if (blankRow(row)) return;
      var r = parseCategoryRow(row);
      if (r.reason) problem(T.settings, i + 2, r.reason); else categories.push(r.category);
    });
    var payMethods = [], payLines = [];
    vals(res, 3).forEach(function (row, i) {
      if (blankRow(row)) return;
      var r = parsePayRow(row);
      if (r.reason) problem(T.settings, i + 2, r.reason); else { payMethods.push(r.pay); payLines.push(i + 2); }
    });
    var ctx = {
      categories: categories.map(function (c) { return c.name; }),
      payMethods: payMethods.map(function (p) { return p.name; }),
    };

    // 이름이 겹치는 결제 수단은 이름을 바로잡지 않아도 읽을 때마다 알린다 (원본과 같다, 바로잡기 여부와 무관)
    payNamePlan(payMethods).clashes.forEach(function (c) { problem(T.settings, payLines[c.index], payClashReason(c.name)); });

    var txns = [];
    var seen = {};
    vals(res, 0).forEach(function (row, i) {
      var line = i + 2;
      var id = str_(cell_(row, 9));
      var oldK = str_(cell_(row, 10));
      if (blankRow((row || []).slice(0, 9))) { // 입력 칸(A~I)이 비면 번호·확인 칸만 남은 빈 줄
        if (/^건너뜀: /.test(oldK)) fix(T.txns, 'K' + line, '');
        return;
      }
      var r = parseTxnRow(row, ctx);
      if (r.reason) {
        var msg = '건너뜀: ' + r.reason;
        if (oldK !== msg) fix(T.txns, 'K' + line, msg);
        problem(T.txns, line, r.reason);
        if (id !== '' && !seen[id]) seen[id] = true;
        return;
      }
      if (id === '' || seen[id]) {
        id = uniqueId(seen);
        fix(T.txns, 'J' + line, id);
      }
      seen[id] = true;
      if (oldK !== '') fix(T.txns, 'K' + line, '');
      r.txn.id = id;
      txns.push(r.txn);
    });

    var budgets = [];
    vals(res, 1).forEach(function (row, i) {
      if (blankRow(row)) return;
      var r = parseBudgetRow(row, ctx);
      if (r.reason) problem(T.budgets, i + 2, r.reason); else budgets.push(r.budget);
    });

    var ruleLog = [];
    vals(res, 6).forEach(function (row) {
      if (blankRow(row)) return;
      ruleLog.push({ ruleId: str_(cell_(row, 0)), date: dateCell_(cell_(row, 1)) || '', txnId: str_(cell_(row, 2)), ranAt: str_(cell_(row, 3)) });
    });
    var rules = [];
    var seenRules = {};
    vals(res, 4).forEach(function (row, i) {
      var line = i + 2;
      var id = str_(cell_(row, 14));
      var oldX = str_(cell_(row, 13));
      if (blankRow((row || []).slice(0, 12))) { // 입력 칸(K~V)이 비면 번호·읽은 반복만 남은 빈 줄
        if (/^건너뜀: /.test(oldX)) fix(T.settings, 'X' + line, '');
        return;
      }
      var r = parseRuleRow(row, ctx);
      if (r.reason) {
        var msg = '건너뜀: ' + r.reason;
        if (oldX !== msg) fix(T.settings, 'X' + line, msg);
        problem(T.settings, line, r.reason);
        if (id !== '' && !seenRules[id]) seenRules[id] = true;
        return;
      }
      if (id === '' || seenRules[id]) {
        id = uniqueId(seenRules);
        fix(T.settings, 'Y' + line, id);
      }
      seenRules[id] = true;
      r.rule.id = id;
      if (isBlank_(cell_(row, 15))) { // 시트에서 넣은 규칙: 읽은 날이 만든 날
        r.rule.createdOn = todayKST(new Date());
        fix(T.settings, 'Z' + line, toSerial(r.rule.createdOn));
      }
      var left = remainingCount(r.rule, ruleLog);
      var wantW = left === null ? '' : left;
      if (String(cell_(row, 12) == null ? '' : cell_(row, 12)) !== String(wantW)) fix(T.settings, 'W' + line, wantW);
      var wantX = repeatText(r.rule);
      if (oldX !== wantX) fix(T.settings, 'X' + line, wantX);
      r.rule.left = left;
      rules.push(r.rule);
    });

    var installs = [];
    vals(res, 7).forEach(function (row) {
      if (blankRow(row)) return;
      installs.push({ id: str_(cell_(row, 0)), title: str_(cell_(row, 1)), months: toInt_(cell_(row, 2)) || 0, txnIds: splitList(cell_(row, 3)) });
    });

    if (fixes.length) {
      await rest.json('POST', Rest.SHEETS + encodeURIComponent(bookId) + '/values:batchUpdate', { valueInputOption: 'RAW', data: fixes });
    }
    await BookStore.trimCheckboxes(rest, bookId, vals(res, 0));
    var book = { info: info, categories: categories, payMethods: payMethods, txns: txns, budgets: budgets, rules: rules, ruleLog: ruleLog, installs: installs };
    return { book: book, problems: problems };
  },

  /**
   * 빈 줄(A:K 가 모두 비었거나 G 의 FALSE 뿐)의 G열 체크박스(값·입력 검사)를 지운다. txnRows = loadBook 이 읽은 내역 A2:K 줄 배열.
   * 이어진 줄마다 updateCells 하나, 전부 :batchUpdate 한 번. 정리할 것이 없으면 요청 0번(시트 속성도 읽지 않는다).
   * 실패해도 던지지 않는다 — 읽기는 그대로 돌려주고 다음에 열 때 다시 정리한다.
   */
  trimCheckboxes: async function (rest, bookId, txnRows) {
    try {
      var spans = []; // [시작 줄 인덱스(0부터, 시트 기준), 끝 줄 인덱스(포함 안 함)]
      (txnRows || []).forEach(function (row, i) {
        if (!BookStore.blankRow(row) || (row || [])[6] !== false) return;
        var idx = i + 1; // 내역 A2 부터 읽었으므로 시트 줄 인덱스는 i+1
        var last = spans[spans.length - 1];
        if (last && last[1] === idx) last[1] = idx + 1; else spans.push([idx, idx + 1]);
      });
      if (!spans.length) return;
      var sheetId = await BookStore.sheetIdOf(rest, bookId, TABS.txns);
      await rest.json('POST', Rest.SHEETS + encodeURIComponent(bookId) + ':batchUpdate', { requests: spans.map(function (sp) {
        return { updateCells: { range: { sheetId: sheetId, startRowIndex: sp[0], endRowIndex: sp[1], startColumnIndex: 6, endColumnIndex: 7 }, fields: 'userEnteredValue,dataValidation' } };
      }) });
    } catch (e) { /* 정리는 덤이다. 다음에 다시 */ }
  },

  /**
   * 시험용 사본: 드라이브 copy 요청 한 번으로 srcId 의 사본을 만들고 새 파일 id 를 돌려준다.
   * srcId 에는 이 copy(읽기) 요청 말고 아무것도 보내지 않는다.
   */
  copyBook: async function (rest, srcId, todayYmd) {
    var res = await rest.json('POST', Rest.DRIVE + 'files/' + encodeURIComponent(srcId) + '/copy', { name: '모아 시험 사본 (C-2) ' + todayYmd });
    if (!res || !res.id) throw new Error('사본을 만들지 못했어요');
    return res.id;
  },

  // ── 거래 쓰기 (관문 1: 일시불 새 기록 · 수정 · 지우기만) ──
  notFoundMessage: '항목을 찾을 수 없습니다 (이미 삭제되었을 수 있습니다)',
  installLaterMessage: '할부는 다음 단계에서 열려요',

  /** 화면 입력을 거래로 검증한다 (src/Api.js checkTxnInput_ 과 같은 규칙·문구). 카테고리는 같은 유형이어야 한다 */
  checkTxnInput: function (book, input) {
    input = input || {};
    var type = String(input.type);
    if (TYPES.indexOf(type) < 0) throw new Error('유형은 지출·수입 중에서 골라 주세요');
    var category = String(input.category == null ? '' : input.category);
    if (!book.categories.some(function (c) { return c.name === category && c.type === type; })) throw new Error('카테고리를 골라 주세요');
    var payMethod = String(input.payMethod == null ? '' : input.payMethod);
    var pay = null;
    book.payMethods.forEach(function (p) { if (p.name === payMethod) pay = p; });
    if (!pay) throw new Error('결제 수단을 골라 주세요');
    var date = String(input.date == null ? '' : input.date);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('날짜를 확인해 주세요');
    var amount = parseAmount(input.amount);
    return { type: type, category: category, payMethod: payMethod, pay: pay, date: date, amount: amount, memo: String(input.memo == null ? '' : input.memo).trim() };
  },

  // 탭 이름 → sheetId. 처음 필요할 때 한 번 읽어 가계부별로 기억한다 (열 때는 읽지 않는다)
  sheetIds_: {},
  sheetIdOf: async function (rest, bookId, title) {
    var cache = BookStore.sheetIds_[bookId];
    if (!cache) {
      var res = await rest.json('GET', Rest.SHEETS + encodeURIComponent(bookId) + '?fields=' + encodeURIComponent('sheets.properties(sheetId,title)'));
      cache = {};
      (res.sheets || []).forEach(function (s) { cache[s.properties.title] = s.properties.sheetId; });
      BookStore.sheetIds_[bookId] = cache;
    }
    if (!(title in cache)) throw new Error('탭을 찾을 수 없어요: ' + title);
    return cache[title];
  },

  // 앱 번호(J열) → 줄 번호 (첫 줄이 이긴다). 쓰기 직전에 새로 읽는다
  txnRowsById: async function (rest, bookId) {
    var res = await rest.json('GET', Rest.SHEETS + encodeURIComponent(bookId) + '/values/' +
      encodeURIComponent(BookStore.q(TABS.txns, 'J:J')) + '?valueRenderOption=UNFORMATTED_VALUE');
    var col = res.values || [];
    var map = {};
    for (var i = 1; i < col.length; i++) {
      var id = col[i] && col[i][0] != null ? String(col[i][0]) : '';
      if (id !== '' && !(id in map)) map[id] = i + 1;
    }
    return map;
  },

  // 내역 A~G 칸의 입력 검사 — src/SheetSetup.js setupRequests 의 내역 규칙과 같게 둔다 (tests/c2-bookstore.test.js 가 비교한다).
  // 새 줄은 appendCells 로 들어가 시트에 걸어 둔 열 검사를 물려받지 못하므로 칸마다 직접 넣는다.
  // 금액(E) 검사식만 원본(E2 기준)과 다르다: appendCells 에는 줄 번호가 없어서 자기 칸을 INDIRECT("RC") 로 가리킨다. 검사 없는 열(H~K)은 빠진다.
  txnValidation: function (col) {
    var list = function (values) { return { type: 'ONE_OF_LIST', values: values.map(function (v) { return { userEnteredValue: v }; }) }; };
    var range = function (a1) { return { type: 'ONE_OF_RANGE', values: [{ userEnteredValue: a1 }] }; };
    switch (col) {
      case 0: return { condition: { type: 'DATE_IS_VALID' }, strict: true, inputMessage: '날짜만 넣을 수 있어요 (예: 2026-11-16)' };
      case 1: return { condition: list(['지출', '수입']), strict: true, showCustomUi: true };
      case 2: return { condition: range("='설정'!$C$2:$C$200"), strict: true, showCustomUi: true };
      case 3: return { condition: range("='설정'!$I$2:$I$200"), strict: true, showCustomUi: true };
      case 4: {
        var me = 'INDIRECT("RC",FALSE)';
        return { condition: { type: 'CUSTOM_FORMULA', values: [{ userEnteredValue: '=AND(ISNUMBER(' + me + '), ' + me + '>=1, ' + me + '=INT(' + me + '))' }] },
          strict: true, inputMessage: '1원 이상의 정수만' };
      }
      case 6: return { condition: { type: 'BOOLEAN' } };
      default: return null;
    }
  },

  // 값 하나를 appendCells 칸으로: 숫자·글자·참거짓, 빈 값은 빈 칸
  cellOf: function (v) {
    if (v === '' || v == null) return {};
    if (typeof v === 'number') return { userEnteredValue: { numberValue: v } };
    if (typeof v === 'boolean') return { userEnteredValue: { boolValue: v } };
    return { userEnteredValue: { stringValue: String(v) } };
  },

  /**
   * 거래 저장 (src/Api.js api_saveTxn 의 일시불·수정 부분). ctx = { today: 'YYYY-MM-DD' }.
   * 새 기록은 appendCells 한 번(재시도 없음: 응답이 끊겨도 중복되지 않게. 사용자가 다시 누르면 같은 번호 검사가 막는다).
   */
  saveTxn: async function (rest, bookId, input, ctx) {
    var book = (await BookStore.loadBook(rest, bookId, {})).book;
    var v = BookStore.checkTxnInput(book, input);
    var existing = null;
    if (input.id) book.txns.forEach(function (t) { if (t.id === input.id) existing = t; });
    if (input.edit === true && !existing) throw new Error(BookStore.notFoundMessage);
    if (existing && input.edit !== true) { // 다시 시도: 이미 들어갔다
      var ins = installOf(book, existing.id);
      if (!ins) return { txns: [existing], install: null };
      var rounds = book.txns.filter(function (t) { return ins.txnIds.indexOf(t.id) >= 0; })
        .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      return { txns: rounds, install: ins };
    }
    if (!existing && Number(input.months) >= 2) throw new Error(BookStore.installLaterMessage);
    // 예산 없는 미래 달 손 기록은 막는다 (#70)
    var movesMonth = !existing || ymOf(existing.date) !== ymOf(v.date);
    if (movesMonth && futureMonthWithoutBudget(book, v.date, ctx.today)) throw new Error(NO_BUDGET_MONTH_TEXT);
    var base = Rest.SHEETS + encodeURIComponent(bookId);
    if (existing) {
      var updated = { id: existing.id, date: v.date, type: v.type, category: v.category, payMethod: v.payMethod,
        amount: v.amount, memo: v.memo, canceled: existing.canceled, inst: existing.inst, auto: existing.auto };
      var rows = await BookStore.txnRowsById(rest, bookId);
      if (!(updated.id in rows)) throw new Error(BookStore.notFoundMessage);
      var r = rows[updated.id];
      // A:K 한 번에, J(앱 번호)에 같은 id를 다시 쓴다 — 다른 기기가 그 줄을 막 지웠어도 번호 없는 줄이 생기지 않는다 (I2)
      await rest.json('POST', base + '/values:batchUpdate', { valueInputOption: 'RAW', data: [
        { range: BookStore.q(TABS.txns, 'A' + r + ':K' + r), values: [txnToRow(updated).concat([updated.id, ''])] },
      ] });
      return { txns: [updated], install: null };
    }
    var txn = { id: input.id || newId(), date: v.date, type: v.type, category: v.category, payMethod: v.payMethod,
      amount: v.amount, memo: v.memo, canceled: false, inst: '', auto: false };
    var sheetId = await BookStore.sheetIdOf(rest, bookId, TABS.txns);
    await rest.json('POST', base + ':batchUpdate', { requests: [{ appendCells: {
      sheetId: sheetId,
      // 칸마다 내역 시트와 같은 입력 검사를 함께 넣는다. G 칸(취소 체크박스)은 값도 함께 — 기록 있는 줄에만 체크박스가 있다 (#109)
      rows: [{ values: txnToRow(txn).concat([txn.id]).map(BookStore.cellOf).map(function (c, j) {
        var rule = BookStore.txnValidation(j);
        if (j === 6) c = { userEnteredValue: { boolValue: txn.canceled } };
        return rule ? Object.assign({}, c, { dataValidation: rule }) : c;
      }) }],
      fields: 'userEnteredValue,dataValidation',
    } }] }, { retry: false });
    return { txns: [txn], install: null };
  },

  /** 거래 지우기: 줄을 없애지 않고 A:K 의 값과 G열 체크박스를 비운다. 지운 거래를 돌려준다 */
  deleteTxns: async function (rest, bookId, ids) {
    var book = (await BookStore.loadBook(rest, bookId, {})).book;
    var seen = {};
    ids = (ids || []).filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
    var removed = [];
    ids.forEach(function (id) {
      var found = null;
      book.txns.forEach(function (t) { if (t.id === id) found = t; });
      if (!found) throw new Error(BookStore.notFoundMessage);
      removed.push(found);
    });
    if (removed.some(function (t) { return t.inst; })) throw new Error(BookStore.installLaterMessage);
    if (!ids.length) return { removed: [], installs: [], renumbered: [] };
    var rows = await BookStore.txnRowsById(rest, bookId);
    var lines = [];
    ids.forEach(function (id) {
      if (!(id in rows)) throw new Error(BookStore.notFoundMessage);
      if (lines.indexOf(rows[id]) < 0) lines.push(rows[id]);
    });
    // values:batchClear 는 G열 입력 검사를 못 지운다 → updateCells 로 A:K 값만 비우고(A~E 검사는 살린다), G열 체크박스 검사는 따로 지운다.
    // 같은 줄을 두 번 비워도 같으니 재시도 허용

// 전역으로 쓰는 것: Bridge(shared·signOut·disconnectAll). 브라우저 전용 부분은 installDefault 안에서만 window 를 쓴다

  CONFIRM: '모든 기기에서 모아 연결을 끊을까요? 이 기기와 다른 기기 모두 다시 로그인해야 해요.',

  create: function (deps) {
    var App = deps.App, doc = deps.doc;

    function email() {
      try { var s = JSON.parse(deps.storage.getItem('moa_sess')); return s && s.email ? String(s.email) : ''; } catch (e) { return ''; }
    }

    function cardHtml() {
      return '<div class="card" id="c2-account">' +
        '<div class="label">계정</div>' +
        '<div class="meta" style="overflow-wrap:anywhere">' + App.esc(email()) + '</div>' +
        '<button type="button" class="btn" data-c2="signout" style="margin-top:14px">이 기기에서 로그아웃</button>' +
        '<button type="button" class="btn danger-btn" data-c2="disconnect" style="margin-top:10px">모든 기기에서 연결 끊기</button>' +
        '<p class="small" id="c2-account-msg" style="color:var(--sub)" role="status"></p>' +

      if (!top || top.name !== 'settings') return;
      var app = doc.getElementById('app');
      if (!app) return;
      var screen = app.querySelector('.screen');
      if (!screen || screen.querySelector && screen.querySelector('#c2-account')) return;
      screen.insertAdjacentHTML('beforeend', cardHtml());
    }

      if (m) m.textContent = text;
    }

      if (act === 'signout') { deps.signOut(); return; }
      if (act === 'disconnect') {
        if (!deps.confirm(Account.CONFIRM)) return;
        var r = await deps.disconnectAll();
        if (!r || !r.ok) say((r && r.message) || Bridge.OFFLINE);
      }
    }

    return { decorate: decorate, onAct: onAct, cardHtml: cardHtml };

  installDefault: function (win) {
    var doc = win.document;
    var storage = { getItem: function (k) { try { return win.localStorage.getItem(k); } catch (e) { return null; } } };

    function wrap() {

        confirm: function (m) { return win.confirm(m); }

// ---- Dates.js ----
/**
 * [순수] 한국 시간(KST, UTC+9) 기준 날짜 유틸.
 * 날짜 문자열은 'YYYY-MM-DD', 월 키는 'YYYY-MM'.
 */
var KST_OFFSET_MS = 9 * 60 * 60 * 1000;

function pad2_(n) {
  return (n < 10 ? '0' : '') + n;
}

function todayKST(now) {
  var d = new Date(now.getTime() + KST_OFFSET_MS);
  return d.getUTCFullYear() + '-' + pad2_(d.getUTCMonth() + 1) + '-' + pad2_(d.getUTCDate());
}

/** 앞 오늘 → 새 오늘: '' (같음·앞 값 없음) · 'day' (같은 달 다른 날) · 'month' (달이 바뀜). 화면을 열어 둔 채 자정을 넘길 때 */
function todayChange(before, now) {
  if (!before || before === now) return '';
  return String(before).slice(0, 7) === String(now).slice(0, 7) ? 'day' : 'month';
}

function ymOf(date) {
  return String(date).slice(0, 7);
}

function daysInMonth(year, month) {
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}

function clampDay(year, month, day) {
  var d = Math.min(day, daysInMonth(year, month));
  return year + '-' + pad2_(month) + '-' + pad2_(d);
}

function addMonths(year, month, delta) {
  var index = year * 12 + (month - 1) + delta;
  return { year: Math.floor(index / 12), month: (index % 12) + 1 };
}

function daysLeftInMonth(date) {
  var year = Number(date.slice(0, 4));
  var month = Number(date.slice(5, 7));
  var day = Number(date.slice(8, 10));
  return daysInMonth(year, month) - day + 1;
}

/** 구글 시트 일련번호(1899-12-30부터 일수) ↔ 'YYYY-MM-DD'. UTC로만 계산해 시간대 어긋남이 없다 */
var SERIAL_EPOCH_MS = Date.UTC(1899, 11, 30);

function toSerial(ymd) {
  var s = String(ymd);
  var ms = Date.UTC(Number(s.slice(0, 4)), Number(s.slice(5, 7)) - 1, Number(s.slice(8, 10)));
  return Math.round((ms - SERIAL_EPOCH_MS) / 86400000);
}

function fromSerial(n) {
  var d = new Date(SERIAL_EPOCH_MS + Math.floor(n) * 86400000);

function parseCategoryRow(row) {

/**
 * 결제 수단의 저장 이름 = "종류 - 뒤쪽 이름" (#88). 앱·설정 탭·내역 탭·드롭다운·보는 탭이 모두 이 글자를 쓴다 (이원화하지 않는다).
 * 사람은 종류를 고르고 뒤쪽 이름만 친다. 뒤쪽 이름이 종류와 같으면 종류만 ("현금")

var PAY_SEP = ' - ';

/** 저장 이름 → 뒤쪽 이름: 앞의 "현금 - / 카드 - / 이체 - / 기타 - "(공백 없거나 다른 줄표도) 하나만 떼어 낸다. 없으면 그대로 */
function payShortName(name) {
  var s = str_(name).replace(/^\s+/, ''); // 뒤 공백은 남겨 두어야 "카드 - "(뒤쪽이 빈 것)를 알아본다
  var m = /^(현금|카드|이체|기타)\s*[-–—]\s*/.exec(s); // 붙여 쓴 "카드-신한"·다른 줄표도 종류 글자로 본다
  return (m ? s.slice(m[0].length) : s).trim();
}

/** 지금 이름과 종류로 바른 저장 이름 (이미 바르면 그대로 — 두 번 불러도 같다) */

}

function parseBudgetRow(row, ctx) {
