<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모아시험">
<title>모아 권한 시험</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  #105 구조 C 시험 (2026-11-22, 버리는 페이지 — 공개 사이트에 잠깐 올렸다가 내린다)
  질문: 아이폰 홈 화면 앱(우리 사이트 아이콘)에서 구글 권한(1시간짜리 열쇠)을
        사람이 아무것도 안 하고 다시 받을 수 있는가?
  방식: Google Identity Services 토큰 방식(initTokenClient) — 서버 없이 브라우저만
  기록은 이 기기 localStorage에만 남는다(열쇠 값은 화면에 보이지 않음)
-->
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#20352a; --sub:#7c8781; --primary:#3d6a4f; --line:#ebe9e4; --ok:#2f7a45; --bad:#b3412e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
         font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:18px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  .row b { font-weight:600; text-align:right; word-break:break-all; }
  button { display:block; width:100%; font:inherit; font-weight:600; border:none; border-radius:14px;
           padding:14px; margin:8px 0; background:var(--primary); color:#fff; }
  button.sub { background:var(--line); color:var(--ink); }
  #log { font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-all; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<h1>모아 권한 시험</h1>

<div class="card">
  <div class="row"><span>열린 방식</span><b id="mode">-</b></div>
  <div class="row"><span>계정</span><b id="who">-</b></div>
  <div class="row"><span>열쇠 남은 시간</span><b id="left">없음</b></div>
  <div class="row"><span>마지막 드라이브 확인</span><b id="drive">-</b></div>
</div>

<div class="card">
  <button id="b1">① 처음 로그인 (한 번만)</button>
  <button id="b2">② 조용히 다시 받기</button>
  <button id="b3" class="sub">③ 드라이브 읽기만 해 보기</button>
  <button id="b4" class="sub">열쇠 버리기 (만료 흉내)</button>
</div>

<div class="card"><div id="log"></div></div>
<button id="b5" class="sub">기록 지우기</button>

<script>
const CLIENT_ID = '235609867917-slsbs2l5bdnnl6os0p49okjbnc7m91tg.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const K = { tok: 'spk_tok', exp: 'spk_exp', who: 'spk_who', log: 'spk_log', drive: 'spk_drive' };
const $ = id => document.getElementById(id);
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

function now() {
  return new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}
function log(msg, cls) {
  const line = `[${now()}] ${standalone ? '아이콘' : 'Safari'} · ${msg}`;
  const all = (ls.get(K.log) || '').split('\n').filter(Boolean);
  all.unshift((cls === 'bad' ? '✗ ' : cls === 'ok' ? '✓ ' : '· ') + line);
  ls.set(K.log, all.slice(0, 80).join('\n'));
  render();
}
function render() {
  $('mode').textContent = standalone ? '홈 화면 아이콘' : 'Safari 탭';
  $('who').textContent = ls.get(K.who) || '-';
  $('drive').textContent = ls.get(K.drive) || '-';
  const exp = +ls.get(K.exp) || 0;
  const min = Math.round((exp - Date.now()) / 60000);
  $('left').textContent = !ls.get(K.tok) ? '없음' : min > 0 ? `${min}분` : '만료됨';
  $('log').innerHTML = (ls.get(K.log) || '(기록 없음)').split('\n').map(l =>
    `<div class="${l.startsWith('✓') ? 'ok' : l.startsWith('✗') ? 'bad' : ''}">${l.replace(/</g, '&lt;')}</div>`).join('');
}

let client = null, pending = null;
function initClient() {
  if (client || !window.google?.accounts?.oauth2) return client;
  client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: resp => {
      const p = pending; pending = null;
      const ms = p ? Date.now() - p.t0 : 0;
      if (resp.error) { log(`${p?.label || '열쇠'} 실패: ${resp.error} ${resp.error_description || ''} (${ms}ms)`, 'bad'); return; }
      ls.set(K.tok, resp.access_token);
      ls.set(K.exp, String(Date.now() + (resp.expires_in - 60) * 1000));
      log(`${p?.label || '열쇠'} 받음 (${ms}ms, ${Math.round(resp.expires_in / 60)}분짜리)`, 'ok');
      driveCheck();
    },
    error_callback: err => {
      const p = pending; pending = null;
      log(`${p?.label || '열쇠'} 창 문제: ${err.type} ${err.message || ''}`, 'bad');
    },
  });
  return client;
}
function ask(label, prompt) {
  if (!initClient()) { log('구글 스크립트가 아직 안 불러와짐', 'bad'); return; }
  pending = { label, t0: Date.now() };
  const opt = { prompt };
  const who = ls.get(K.who);
  if (who && who.includes('@')) opt.login_hint = who;
  client.requestAccessToken(opt);
}

async function driveCheck() {
  const tok = ls.get(K.tok);
  if (!tok) { log('드라이브: 열쇠 없음', 'bad'); return; }
  try {
    const h = { Authorization: 'Bearer ' + tok };
    const a = await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', { headers: h });
    if (!a.ok) throw new Error('about ' + a.status);
    const email = (await a.json()).user.emailAddress;
    ls.set(K.who, email);
    const q = encodeURIComponent("name='모아 권한 시험' and trashed=false");
    const l = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers: h });
    if (!l.ok) throw new Error('list ' + l.status);
    let files = (await l.json()).files;
    if (!files.length) {
      const c = await fetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: '모아 권한 시험', mimeType: 'application/vnd.google-apps.spreadsheet' }),
      });
      if (!c.ok) throw new Error('create ' + c.status);
      log('드라이브에 "모아 권한 시험" 시트 만듦', 'ok');
      files = [await c.json()];
    }
    ls.set(K.drive, now() + ' OK');
    log(`드라이브 읽기 OK (${email})`, 'ok');
  } catch (e) {
    ls.set(K.drive, now() + ' 실패');
    log('드라이브 실패: ' + e.message, 'bad');
  }
}

$('b1').onclick = () => ask('① 처음 로그인', 'consent');
$('b2').onclick = () => ask('② 누르고 다시 받기', 'none');
$('b3').onclick = () => driveCheck();
$('b4').onclick = () => { ls.set(K.exp, '0'); ls.del(K.tok); log('열쇠 버림'); };
$('b5').onclick = () => { ls.del(K.log); render(); };

// 열 때마다: 열쇠가 있으면 드라이브 확인, 만료됐으면 누르지 않고 조용히 다시 받기를 시도한다 (가장 중요한 질문)
function onOpen(why) {
  render();
  if (!ls.get(K.who)) { log(`${why} — 아직 로그인 전`); return; }
  const exp = +ls.get(K.exp) || 0;
  if (ls.get(K.tok) && exp > Date.now()) { log(`${why} — 열쇠 아직 유효`); driveCheck(); return; }
  log(`${why} — 열쇠 만료 → 누르지 않고 다시 받기 시도`);
  ask('자동(안 누름) 다시 받기', 'none');
}
let started = false;
window.onGsiLoad = () => { if (!started) { started = true; onOpen('앱 열림'); } };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) onOpen('다시 보임'); });
setInterval(render, 30000);
render();
</script>
<script src="https://accounts.google.com/gsi/client" async onload="onGsiLoad()"></script>
</body>
</html>
